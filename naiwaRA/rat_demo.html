<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏内老鼠 · 随机游荡 / 见人逃跑</title>
<style>
  :root{--bg:#16171a;--panel:#202329;--line:#343940;--txt:#e7e4dc;--dim:#9aa0a8;--accent:#d8c98a;--warn:#e07a5f;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;background:rgba(26,28,32,.88);border:1px solid var(--line);border-radius:6px;padding:12px 14px;backdrop-filter:blur(6px)}
  #info{left:16px;top:16px;width:288px}
  #info h1{margin:0 0 6px;font-size:14px;color:var(--accent);letter-spacing:.5px}
  #info .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .legend{display:grid;grid-template-columns:12px 1fr auto;gap:5px 8px;align-items:center;margin:10px 0}
  .dot{width:9px;height:9px;border-radius:50%}
  .legend span:nth-child(3){color:var(--dim);font-size:11px}
  #stats{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;color:var(--dim);font-size:11px}
  #stats b{color:var(--txt);font-weight:500}
  #ctrl{right:16px;top:16px;width:250px}
  #ctrl h2{margin:0 0 8px;font-size:12px;color:var(--accent)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;color:var(--dim)}
  .row input[type=range]{width:118px;accent-color:var(--accent)}
  .row output{color:var(--txt);min-width:34px;text-align:right}
  button{background:#2a2e35;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #hint{left:50%;bottom:18px;transform:translateX(-50%);color:var(--dim);font-size:11px;text-align:center;white-space:nowrap}
  kbd{background:#2a2e35;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--txt)}
  #toast{left:50%;top:16px;transform:translateX(-50%);padding:8px 14px;display:none}
  #toast.err{display:block;color:var(--warn);border-color:var(--warn)}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="info">
  <h1>RAT · 游戏内老鼠</h1>
  <div class="sub">随机游荡 · 视野内见人逃跑 · 程序化四足步态</div>
  <div class="legend">
    <div class="dot" style="background:#8fd694"></div><span>wander 游荡</span><span>慢速随机</span>
    <div class="dot" style="background:#e8c65a"></div><span>alert 警觉</span><span>停住转向你</span>
    <div class="dot" style="background:#e07a5f"></div><span>flee 逃跑</span><span>高速之字撤离</span>
    <div class="dot" style="background:#8896a8"></div><span>calm 冷静</span><span>短暂停顿</span>
  </div>
  <div id="stats">加载中…</div>
</div>

<div class="panel" id="ctrl">
  <h2>调试参数</h2>
  <div class="row"><label for="rDetect">侦测距离</label><input id="rDetect" type="range" min="1" max="7" step="0.1" value="2.8"><output id="oDetect">2.8</output></div>
  <div class="row"><label for="rSafe">脱离距离</label><input id="rSafe" type="range" min="2" max="10" step="0.1" value="5.2"><output id="oSafe">5.2</output></div>
  <div class="row"><label for="rFlee">逃跑速度</label><input id="rFlee" type="range" min="0.5" max="5" step="0.1" value="2.15"><output id="oFlee">2.15</output></div>
  <div class="row"><label for="cRings">感知圈</label><button id="cRings">显示</button></div>
  <div class="row"><label for="cPause">暂停</label><button id="cPause">运行</button></div>
  <div class="row"><button id="cReset">重置老鼠位置</button></div>
</div>

<div class="panel" id="toast"></div>
<div id="hint"><kbd>W A S D</kbd> 移动玩家 · <kbd>Shift</kbd> 快走 · 靠近老鼠看它逃跑 · 鼠标拖动转视角 · 滚轮缩放</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="assets/rat_pack_data.js"></script>
<script src="assets/rat_actor.js"></script>
<script>
(function(){
  "use strict";
  var toast=document.getElementById("toast");
  function fail(msg){toast.className="panel err";toast.textContent=msg;console.error(msg);}
  if(typeof THREE==="undefined"){fail("THREE 加载失败");return;}

  var canvas=document.getElementById("view");
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x9aa2a4);
  scene.fog=new THREE.Fog(0x9aa2a4,16,46);
  var camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.05,120);

  // ---- 地面：像素风棋盘 ----
  var cv=document.createElement("canvas");cv.width=cv.height=128;
  var cx=cv.getContext("2d");
  cx.fillStyle="#4f5749";cx.fillRect(0,0,128,128);
  cx.fillStyle="#575f50";
  for(var gy=0;gy<8;gy++)for(var gx=0;gx<8;gx++)if((gx+gy)%2===0)cx.fillRect(gx*16,gy*16,16,16);
  cx.fillStyle="rgba(0,0,0,.10)";
  for(var i=0;i<70;i++)cx.fillRect(Math.random()*128|0,Math.random()*128|0,2,2);
  var tex=new THREE.CanvasTexture(cv);
  tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(12,12);
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(32,32),new THREE.MeshBasicMaterial({map:tex}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.001;scene.add(ground);

  // ---- 场景道具：让空间有参照 ----
  var props=new THREE.Group();scene.add(props);
  function box(x,z,w,h,d,col){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:col}));
    m.position.set(x,h/2,z);props.add(m);return m;
  }
  box(-6.5,-4.5,1.6,0.9,1.2,0x5b6257);
  box( 6.8, 3.2,2.0,0.6,1.4,0x646b5f);
  box(-3.0, 5.5,1.2,1.6,1.2,0x555c53);
  box( 4.2,-6.0,1.4,1.1,2.2,0x606657);
  // 栅栏边界
  var fenceMat=new THREE.MeshBasicMaterial({color:0x4a5048});
  for(var f=-15;f<=15;f+=2){
    [[f,-16],[f,16],[-16,f],[16,f]].forEach(function(pt){
      var m=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.55,0.10),fenceMat);
      m.position.set(pt[0],0.275,pt[1]);props.add(m);
    });
  }

  // ---- 玩家：一个低模胶囊 + 朝向锥 ----
  var player=new THREE.Group();scene.add(player);
  var body=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.26,1.05,7),new THREE.MeshBasicMaterial({color:0x3b6fa0}));
  body.position.y=0.53;player.add(body);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6),new THREE.MeshBasicMaterial({color:0xd8b68c}));
  head.position.y=1.16;player.add(head);
  var nose=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.22,4),new THREE.MeshBasicMaterial({color:0xd8b68c}));
  nose.rotation.x=-Math.PI/2;nose.position.set(0,1.16,-0.26);player.add(nose);
  player.position.set(0,0,6);

  // ---- 感知圈可视化 ----
  var rings=new THREE.Group();rings.visible=false;scene.add(rings);
  function ring(radius,color){
    var pts=[];for(var i=0;i<=64;i++){var a=i/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*radius,0.015,Math.sin(a)*radius));}
    var g=new THREE.BufferGeometry().setFromPoints(pts);
    var l=new THREE.Line(g,new THREE.LineBasicMaterial({color:color}));rings.add(l);return l;
  }
  var detectRing=ring(2.8,0xe8c65a), safeRing=ring(5.2,0xe07a5f);

  // ---- 老鼠实例 ----
  var BOUNDS={minX:-14,maxX:14,minZ:-14,maxZ:14};
  var obstacles=[
    {x:-6.5,z:-4.5,r:1.0},{x:6.8,z:3.2,r:1.2},{x:-3.0,z:5.5,r:0.8},{x:4.2,z:-6.0,r:1.3}
  ];
  var rats=[];
  var marks=new THREE.Group();scene.add(marks);
  var initPos=[[-2,-2],[2.5,-1],[-5,3],[4,4.5],[-8,-7],[8,-8],[0,-9],[-11,1],[11,0]];
  var stateColor={wander:0x8fd694,alert:0xe8c65a,flee:0xe07a5f,calm:0x8896a8};

  var params={detect:2.8,safe:5.2,flee:2.15,rings:false,paused:false};

  RatActor.ready.then(function(){
    for(var i=0;i<initPos.length;i++){
      var r=RatActor.create({variant:i%3,length:0.95+Math.random()*0.18,position:{x:initPos[i][0],y:0,z:initPos[i][1]}});
      r.root.position.x=initPos[i][0];r.root.position.z=initPos[i][1];
      scene.add(r.root);rats.push(r);
      // 头顶状态点
      var dot=new THREE.Mesh(new THREE.SphereGeometry(0.075,6,5),new THREE.MeshBasicMaterial({color:0x8fd694}));
      marks.add(dot);
    }
    statsEl.textContent="就绪";
  }).catch(function(e){fail("老鼠模型加载失败: "+e.message);});

  // ---- 输入 ----
  var keys={};
  addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(["w","a","s","d"].includes(e.key.toLowerCase()))e.preventDefault();});
  addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
  var yaw=0.6,pitch=-0.72,dist=10,drag=false,lx=0,ly=0;
  canvas.addEventListener("mousedown",function(e){drag=true;lx=e.clientX;ly=e.clientY;});
  addEventListener("mouseup",function(){drag=false;});
  addEventListener("mousemove",function(e){
    if(!drag)return;
    yaw-=(e.clientX-lx)*0.006;pitch=Math.max(-1.45,Math.min(-0.18,pitch-(e.clientY-ly)*0.005));
    lx=e.clientX;ly=e.clientY;
  });
  canvas.addEventListener("wheel",function(e){dist=Math.max(5,Math.min(28,dist+Math.sign(e.deltaY)*1.2));e.preventDefault();},{passive:false});
  addEventListener("resize",function(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

  function bindRange(id,out,key,fmt){
    var el=document.getElementById(id),o=document.getElementById(out);
    el.addEventListener("input",function(){params[key]=+el.value;o.textContent=(fmt?fmt(+el.value):el.value);});
  }
  bindRange("rDetect","oDetect","detect");bindRange("rSafe","oSafe","safe");bindRange("rFlee","oFlee","flee");
  document.getElementById("cRings").addEventListener("click",function(){
    params.rings=!params.rings;rings.visible=params.rings;
    this.textContent=params.rings?"隐藏":"显示";
  });
  document.getElementById("cPause").addEventListener("click",function(){
    params.paused=!params.paused;this.textContent=params.paused?"继续":"运行";
  });
  document.getElementById("cReset").addEventListener("click",function(){
    for(var i=0;i<rats.length;i++)rats[i].setPosition(initPos[i][0],0,initPos[i][1]);
  });

  var statsEl=document.getElementById("stats");
  var clock=new THREE.Clock(),simTime=0,acc=0;
  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    if(!params.paused){
      simTime+=dt;
      // 玩家移动（相机朝向为前进参考）
      var mx=(keys.d?1:0)-(keys.a?1:0), mz=(keys.w?1:0)-(keys.s?1:0);
      var ml=Math.hypot(mx,mz);
      if(ml>0){
        var sp=(keys.shift?4.2:2.4)*dt/ml;
        var fx=-Math.sin(yaw),fz=-Math.cos(yaw);
        var rx=Math.cos(yaw),rz=-Math.sin(yaw);
        player.position.x+=(fx*mz+rx*mx)*sp;
        player.position.z+=(fz*mz+rz*mx)*sp;
        player.position.x=Math.max(-15,Math.min(15,player.position.x));
        player.position.z=Math.max(-15,Math.min(15,player.position.z));
        var want=Math.atan2(-(fx*mz+rx*mx),-(fz*mz+rz*mx));
        player.rotation.y+=Math.atan2(Math.sin(want-player.rotation.y),Math.cos(want-player.rotation.y))*0.25;
      }
      // 老鼠
      var ctx={player:player.position,bounds:BOUNDS,obstacles:obstacles,floorY:0,time:simTime};
      var counts={wander:0,alert:0,flee:0,calm:0};
      for(var i=0;i<rats.length;i++){
        var r=rats[i];
        r.opt={};
        // 运行时改参数：直接写进闭包读的 opt 不便，采用属性覆盖检测
        r.update(dt,{
          player:player.position,bounds:BOUNDS,obstacles:obstacles,floorY:0,time:simTime,
          _detect:params.detect,_safe:params.safe,_flee:params.flee
        });
        counts[r.state]=(counts[r.state]||0)+1;
        var dot=marks.children[i];
        if(dot){
          dot.position.set(r.root.position.x,1.25,r.root.position.z);
          dot.material.color.setHex(stateColor[r.state]||0xffffff);
        }
      }
      acc+=dt;
      if(acc>0.2){
        acc=0;
        var dmin=1e9;
        rats.forEach(function(r){dmin=Math.min(dmin,Math.hypot(r.root.position.x-player.position.x,r.root.position.z-player.position.z));});
        statsEl.innerHTML="老鼠 <b>"+rats.length+"</b> 只 · 最近 <b>"+dmin.toFixed(2)+"</b> m<br>"+
          "游荡 <b>"+(counts.wander||0)+"</b> · 警觉 <b>"+(counts.alert||0)+"</b> · 逃跑 <b>"+(counts.flee||0)+"</b> · 冷静 <b>"+(counts.calm||0)+"</b>";
      }
    }
    detectRing.scale.setScalar(params.detect/2.8);
    safeRing.scale.setScalar(params.safe/5.2);
    rings.position.copy(player.position);
    // 相机跟随（自由相机模式下不覆盖）
    if(!params.freeCamera){
      var cx=player.position.x+Math.sin(yaw)*Math.cos(pitch)*dist;
      var cy=player.position.y-Math.sin(pitch)*dist;
      var cz=player.position.z+Math.cos(yaw)*Math.cos(pitch)*dist;
      camera.position.set(cx,cy,cz);camera.lookAt(player.position.x,0.5,player.position.z);
    }
    renderer.render(scene,camera);
  }
  animate();
  window.__ratDemo={scene:scene,camera:camera,rats:rats,player:player,params:params,get time(){return simTime;}};
})();
</script>
</body>
</html>
