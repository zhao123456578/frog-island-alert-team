<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奶蛙 · 夜班回家路</title>
<style>
  :root{--milk:#e6e2cf;--warm:#ffc27a;--dim:#8b929c;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;
    font-family:"Courier New",monospace;color:var(--milk);}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05070a;}
  #view{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;}
  #scan{position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;opacity:.5;}
  #vig{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,transparent 42%,rgba(2,4,8,.95) 100%);}
  #lid{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.98) 0%,rgba(0,0,0,.55) 20%,
      transparent 34%,transparent 66%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.98) 100%);}
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
    font-size:12px;letter-spacing:.08em;}
  #hud.on{opacity:1;}
  .pill{position:fixed;background:rgba(8,12,16,.55);border:1px solid rgba(230,226,207,.18);
    padding:6px 10px;}
  #hDist{top:14px;left:14px;}
  #hSpeed{top:14px;left:118px;}
  #hRadio{top:14px;right:14px;text-align:right;}
  #hRadio b{color:var(--warm);}
  #hDrow{bottom:16px;left:14px;width:210px;}
  #drowBar{height:6px;background:rgba(230,226,207,.16);margin-top:5px;}
  #drowFill{height:100%;width:10%;background:#cfe3a0;transition:background .3s;}
  #hKeys{bottom:16px;right:14px;text-align:right;color:var(--dim);line-height:1.7;}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:rgba(8,12,16,.72);border:1px solid rgba(230,226,207,.2);
    padding:7px 14px;font-size:12px;opacity:0;transition:opacity .4s;pointer-events:none;}
  #toast.on{opacity:1;}
  #title,#end{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(4,6,9,.92);
    text-align:center;z-index:5;transition:opacity .5s;}
  #title h1{font-size:34px;letter-spacing:.14em;margin:0 0 6px;color:var(--milk);}
  #title .sub{color:var(--dim);letter-spacing:.2em;margin-bottom:34px;}
  #title .keys{color:#a2a89a;font-size:12px;line-height:2;margin-bottom:30px;}
  button{font-family:inherit;font-size:14px;letter-spacing:.2em;color:#12140f;
    background:var(--warm);border:0;padding:11px 26px;cursor:pointer;}
  button:hover{background:#ffd39a;}
  #end{display:none;}
  #end.on{display:flex;}
  #end h2{margin:0 0 18px;font-size:24px;letter-spacing:.12em;}
  #ticket{border:1px dashed rgba(230,226,207,.4);padding:16px 22px;font-size:13px;
    line-height:2;color:#cfd2c0;text-align:left;margin-bottom:24px;min-width:300px;}
  #ticket b{color:var(--warm);font-weight:normal;}
  #hideTip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:15px;letter-spacing:.14em;display:none;z-index:6;}
</style>
</head>
<body>
<div id="wrap"><canvas id="view"></canvas></div>
<div id="scan"></div><div id="vig"></div><div id="lid"></div>
<div id="hud">
  <div class="pill" id="hDist">里程 0.00 km</div>
  <div class="pill" id="hSpeed">0 km/h</div>
  <div class="pill" id="hRadio">电台 <b>深夜交通台</b><br><span id="hRadioLine" style="color:#8b929c">FM 98.7</span></div>
  <div class="pill" id="hDrow">困意 10%<div id="drowBar"><div id="drowFill"></div></div></div>
  <div class="pill" id="hKeys">W 油门 · S 刹车 · A/D 变道<br>SPACE 开窗 · R 雨刷 · 1-4 换台 · F 喝咖啡</div>
</div>
<div id="toast"></div>
<div id="title">
  <h1>夜班 · 回家路</h1>
  <div class="sub">一个普通的周二 23:47</div>
  <div class="keys">W 油门 · S 刹车 · A/D 变道<br>SPACE 按住开窗提神 · R 雨刷 · 1-4 换电台 · F 喝咖啡</div>
  <button id="btnStart">出发</button>
</div>
<div id="end">
  <h2>到家了</h2>
  <div id="ticket"></div>
  <div style="display:flex;gap:12px;">
    <button id="btnAgain">再开一次</button>
    <button id="btnBack" style="background:#2a2f36;color:#cfd2c0;border:1px solid rgba(230,226,207,.28);">回到奶厂</button>
  </div>
</div>
<div id="hideTip">你靠着方向盘睡着了——现在没事，车停在路边。</div>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   奶蛙 · 夜班回家路 —— 室外竖切（独立于三幕工厂）
   渲染 640x360，CSS 拉伸成像素风；世界滚动 = 车不动、路灯与地标向后退
   ============================================================ */

const q=new URLSearchParams(location.search);
const canvas=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(1);
renderer.setSize(1280,720,false);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a1018);
scene.fog=new THREE.FogExp2(0x0a1018,0.019);

const camera=new THREE.PerspectiveCamera(62,1280/720,0.1,600);
camera.position.set(0,1.22,0.30);

/* ---------- 纹理 ---------- */
function mkTex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.magFilter=THREE.LinearFilter;t.minFilter=THREE.LinearFilter;
  return t;
}
const roadTex=mkTex(512,2048,(x,w,h)=>{
  x.fillStyle='#1a1c20';x.fillRect(0,0,w,h);
  for(let i=0;i<26000;i++){const g=(14+Math.random()*26)|0;
    x.fillStyle='rgb('+g+','+(g+1)+','+(g+3)+')';
    x.fillRect(Math.random()*w,Math.random()*h,2,2);}
  /* 细裂纹 */
  x.strokeStyle='rgba(8,9,11,.55)';x.lineWidth=1;
  for(let i=0;i<90;i++){
    const sx=Math.random()*w,sy=Math.random()*h;
    x.beginPath();x.moveTo(sx,sy);
    x.lineTo(sx+(Math.random()-0.5)*40,sy+Math.random()*70);x.stroke();
  }
  /* 轮胎磨痕 */
  x.fillStyle='rgba(10,11,13,.42)';
  x.fillRect(112,0,46,h);x.fillRect(w-158,0,46,h);
  /* 边线 + 中央虚线 */
  x.fillStyle='#b6b091';x.fillRect(18,0,13,h);x.fillRect(w-31,0,13,h);
  x.fillStyle='#d6cfa9';x.fillRect(w/2-7,0,14,h*0.45);
});
roadTex.repeat.set(1,14);
roadTex.anisotropy=8;
const groundTex=mkTex(256,256,(x,w,h)=>{
  x.fillStyle='#16180f';x.fillRect(0,0,w,h);
  for(let i=0;i<5200;i++){const g=(18+Math.random()*22)|0;
    x.fillStyle='rgb('+g+','+(g+3)+','+(g-5)+')';
    x.fillRect(Math.random()*w,Math.random()*h,2,2);}
});
groundTex.repeat.set(70,70);
/* 径向光晕：路灯灯头、月亮、车灯光斑共用 */
const glowTex=mkTex(64,64,(x,w,h)=>{
  const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  g.addColorStop(0,'rgba(255,252,238,1)');
  g.addColorStop(0.3,'rgba(255,232,186,0.5)');
  g.addColorStop(1,'rgba(255,206,150,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
glowTex.wrapS=glowTex.wrapT=THREE.ClampToEdgeWrapping;
function glowSprite(color,scale,opacity){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,
    transparent:true,opacity:opacity,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.set(scale,scale,1);return s;
}
const poolGeo=new THREE.PlaneGeometry(10,10);
/* 车头灯在地面的投影：椭圆渐变 + 模糊，避免聚光灯在地面上切出硬边 */
const beamTex=mkTex(128,256,(x,w,h)=>{
  x.filter='blur(10px)';
  const g=x.createRadialGradient(w/2,h*0.99,0,w/2,h*0.99,h*1.08);
  g.addColorStop(0,'rgba(255,236,198,0.62)');
  g.addColorStop(0.45,'rgba(255,226,178,0.3)');
  g.addColorStop(1,'rgba(255,220,170,0)');
  x.fillStyle=g;x.fillRect(-20,-20,w+40,h+40);
});
beamTex.wrapS=beamTex.wrapT=THREE.ClampToEdgeWrapping;

/* ---------- 灯光 ---------- */
const hemi=new THREE.HemisphereLight(0x3d5166,0x181a12,0.72);scene.add(hemi);
const moonLight=new THREE.DirectionalLight(0x9fb4d8,0.36);
moonLight.position.set(-60,80,-40);scene.add(moonLight);

/* ---------- 地面 / 路 ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(420,420),
  new THREE.MeshLambertMaterial({map:groundTex,color:0x6a705c}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.03,-150);scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(9,420),
  new THREE.MeshLambertMaterial({map:roadTex,color:0xa8aaad}));
road.rotation.x=-Math.PI/2;road.position.set(0,0,-150);scene.add(road);
[-5.2,5.2].forEach(x=>{const sh=new THREE.Mesh(new THREE.PlaneGeometry(1.2,420),
  new THREE.MeshLambertMaterial({color:0x2a2a20}));
  sh.rotation.x=-Math.PI/2;sh.position.set(x,-0.01,-150);scene.add(sh);});

/* ---------- 天空：星 / 月 ---------- */
(function stars(){
  const n=340,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*0.55+0.12,r=260;
    pos[i*3]=Math.cos(a)*Math.cos(e)*r;
    pos[i*3+1]=Math.sin(e)*r;
    pos[i*3+2]=Math.sin(a)*Math.cos(e)*r-60;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({
    color:0xb9c9dd,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:0.7})));
})();
const moon=new THREE.Mesh(new THREE.CircleGeometry(9,20),
  new THREE.MeshBasicMaterial({color:0xdfe2cc,fog:false}));
moon.position.set(130,132,-300);moon.lookAt(0,1,0);scene.add(moon);
const moonHalo=glowSprite(0xcfd8e8,32,0.15);moonHalo.position.copy(moon.position);scene.add(moonHalo);
/* 天际线渐变：远处城市的光污染，让地平线不是一条硬边 */
const skyTex=mkTex(16,256,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#070b12');g.addColorStop(0.55,'#0b121c');
  g.addColorStop(0.8,'#141d28');g.addColorStop(0.93,'#2a2a2b');
  g.addColorStop(1,'#3b342b');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
const sky=new THREE.Mesh(new THREE.PlaneGeometry(1600,400),
  new THREE.MeshBasicMaterial({map:skyTex,fog:false,depthWrite:false}));
sky.position.set(0,120,-560);scene.add(sky);

/* ---------- 路灯 / 反光柱 / 地标 ---------- */
const LAMP_SPAN=240;
const lampMat=new THREE.MeshLambertMaterial({color:0x3a4048});
const lampHeadMat=new THREE.MeshBasicMaterial({color:0xffcf8a});
const lampPoleGeo=new THREE.CylinderGeometry(0.09,0.12,6.2,6);
const lampArmGeo=new THREE.BoxGeometry(1.8,0.09,0.09);
const lampHeadGeo=new THREE.BoxGeometry(0.55,0.14,0.28);
const lamps=[];
for(let i=0;i<8;i++){
  const side=i%2?1:-1;
  const g=new THREE.Group();
  const pole=new THREE.Mesh(lampPoleGeo,lampMat);pole.position.y=3.1;g.add(pole);
  const arm=new THREE.Mesh(lampArmGeo,lampMat);arm.position.set(-side*0.85,6.1,0);g.add(arm);
  const head=new THREE.Mesh(lampHeadGeo,lampHeadMat);head.position.set(-side*1.7,6.03,0);g.add(head);
  const light=new THREE.PointLight(0xffc27a,2.1,30,2);
  light.position.set(-side*1.7,5.85,0);g.add(light);
  const halo=glowSprite(0xffc78a,3.4,0.55);halo.position.set(-side*1.7,5.95,0);g.add(halo);
  const pool=new THREE.Mesh(poolGeo,new THREE.MeshBasicMaterial({map:glowTex,color:0xffb972,
    transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
  pool.rotation.x=-Math.PI/2;pool.position.set(-side*1.7,0.012,0);g.add(pool);
  g.position.set(side*5.6,0,-i*30);
  scene.add(g);lamps.push({grp:g,light:light,base:2.1});
}
const reflMat=new THREE.MeshBasicMaterial({color:0xffd9a0});
const reflGeo=new THREE.BoxGeometry(0.09,0.5,0.09);
const refls=[];
for(let i=0;i<56;i++){
  const side=i%2?1:-1;
  const m=new THREE.Mesh(reflGeo,reflMat);
  m.position.set(side*4.85,0.26,-i*7.5);
  scene.add(m);refls.push(m);
}
/* 远处厂房轮廓 + 零星亮窗 */
const blds=[];
for(let i=0;i<16;i++){
  const side=i%2?1:-1;
  const w=10+Math.random()*16,h=6+Math.random()*14,d=10+Math.random()*14;
  const b=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({color:0x1b2028,emissive:0x05070b}));
  box.position.y=h/2;b.add(box);
  /* 屋顶水箱 / 通风机的剪影，别让厂房都是一样的方盒子 */
  if(Math.random()<0.7){
    const tw=2+Math.random()*3;
    const tank=new THREE.Mesh(new THREE.BoxGeometry(tw,tw*0.8,tw),
      new THREE.MeshLambertMaterial({color:0x161a20}));
    tank.position.set((Math.random()-0.5)*w*0.5,h+tw*0.4,(Math.random()-0.5)*d*0.4);
    b.add(tank);
  }
  const wins=2+(Math.random()*3|0);
  for(let k=0;k<wins;k++){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.2),
      new THREE.MeshBasicMaterial({color:k%3?0xffd08a:0xa8c8e0}));
    win.position.set(-w/2+1+Math.random()*(w-2),2+Math.random()*(h-3),d/2+0.02);
    b.add(win);
  }
  b.position.set(side*(28+Math.random()*36),0,-20-i*22-Math.random()*10);
  scene.add(b);blds.push(b);
}
const BLD_SPAN=380;
/* 高速指示牌：每隔 620 m 从头顶掠过，给长直路一个节奏点 */
const signTex=mkTex(512,160,(x,w,h)=>{
  x.fillStyle='#1f5d3c';x.fillRect(0,0,w,h);
  x.strokeStyle='#e8e6d6';x.lineWidth=8;x.strokeRect(10,10,w-20,h-20);
  x.fillStyle='#e8e6d6';x.textAlign='center';x.textBaseline='middle';
  x.font='700 60px "Microsoft YaHei","Courier New",sans-serif';
  x.fillText('出口 12',w/2,60);
  x.font='700 38px "Microsoft YaHei",sans-serif';
  x.fillText('环城高速 3 km',w/2,120);
});
const signs=[];
{
  const g=new THREE.Group();
  const board=new THREE.Mesh(new THREE.PlaneGeometry(6,1.875),
    new THREE.MeshBasicMaterial({map:signTex}));
  board.position.set(0,6.4,0);g.add(board);
  const poleGeo=new THREE.CylinderGeometry(0.12,0.15,7.4,6);
  [-6.3,6.3].forEach(x=>{const p=new THREE.Mesh(poleGeo,lampMat);
    p.position.set(x,3.7,0.06);g.add(p);});
  const beam=new THREE.Mesh(new THREE.BoxGeometry(13,0.16,0.16),lampMat);
  beam.position.set(0,7.32,0.06);g.add(beam);
  g.position.set(0,0,-260);scene.add(g);signs.push(g);
}
const SIGN_SPAN=620;

/* ---------- 车：引擎盖 / 仪表台 / 方向盘 ---------- */
const car=new THREE.Group();scene.add(car);
/* 各块按“仪表台 -> 前风挡下沿 -> 引擎盖 -> 车头”从近到远排，互不插进去 */
/* 引擎盖：低于仪表台，从风挡下沿往车头延伸 */
const hood=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.05,1.34),
  new THREE.MeshLambertMaterial({color:0x4c4d45}));
hood.position.set(0,0.775,-1.83);car.add(hood);
/* 引擎盖折线 + 前沿高光，贴着盖面，别让它变成两根悬空的线 */
[-0.56,0.56].forEach(x=>{
  const crease=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.004,1.24),
    new THREE.MeshLambertMaterial({color:0x3a3b35}));
  crease.position.set(x,0.802,-1.83);car.add(crease);
});
const hoodEdge=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.015,0.04),
  new THREE.MeshBasicMaterial({color:0x6d6857}));
hoodEdge.position.set(0,0.8075,-2.495);car.add(hoodEdge);
const grille=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.06,0.02),
  new THREE.MeshLambertMaterial({color:0x2a2b26}));
grille.position.set(0,0.72,-2.515);car.add(grille);
[-1.0,1.0].forEach(x=>{
  const f=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.24,0.9),
    new THREE.MeshLambertMaterial({color:0x4c4d45}));
  f.position.set(x,0.67,-1.83);car.add(f);
});
/* 仪表台 + A 柱 + 地台：把座舱围成一体，方块不再浮在路上 */
const dash=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.26,0.38),
  new THREE.MeshLambertMaterial({color:0x1b1c1e}));
dash.position.set(0,0.79,-0.97);car.add(dash);
const dashPad=new THREE.Mesh(new THREE.BoxGeometry(2.06,0.03,0.34),
  new THREE.MeshLambertMaterial({color:0x24252a}));
dashPad.position.set(0,0.935,-0.97);car.add(dashPad);
[-0.78,0.78].forEach(x=>{
  const vent=new THREE.Mesh(new THREE.PlaneGeometry(0.10,0.05),
    new THREE.MeshBasicMaterial({color:0x0b0c0e}));
  vent.position.set(x,0.85,-0.779);car.add(vent);
});
const floorPan=new THREE.Mesh(new THREE.BoxGeometry(2.2,0.05,1.7),
  new THREE.MeshLambertMaterial({color:0x10110e}));
floorPan.position.set(0,0.35,-0.55);car.add(floorPan);
[-1.02,1.02].forEach((x,i)=>{
  const ap=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.3,0.12),
    new THREE.MeshLambertMaterial({color:0x141518}));
  ap.position.set(x,1.47,-1.04);ap.rotation.z=(i?1:-1)*0.10;car.add(ap);
});
const centerStack=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.18,0.06),
  new THREE.MeshLambertMaterial({color:0x1c1d19}));
centerStack.position.set(0.30,0.79,-0.75);car.add(centerStack);
const wheelG=new THREE.Group();
const rim=new THREE.Mesh(new THREE.TorusGeometry(0.2,0.034,6,20),
  new THREE.MeshLambertMaterial({color:0x141518}));
wheelG.add(rim);
for(let i=0;i<3;i++){
  const sp=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.026,0.022),
    new THREE.MeshLambertMaterial({color:0x1d1f23}));
  sp.rotation.z=i*Math.PI/3;wheelG.add(sp);
}
const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.03,10),
  new THREE.MeshLambertMaterial({color:0x33353a}));
hub.rotation.x=Math.PI/2;wheelG.add(hub);
/* 转向柱：从盘子中心斜插进仪表台，避免方向盘看起来悬空 */
const column=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.032,0.36,8),
  new THREE.MeshLambertMaterial({color:0x232427}));
column.rotation.x=Math.PI/2;column.position.set(0,0,-0.18);wheelG.add(column);
wheelG.position.set(-0.40,0.86,-0.62);wheelG.rotation.x=-0.75;wheelG.scale.setScalar(0.7);car.add(wheelG);
/* 仪表台收音机小屏：跟着电台换台 */
const radioCanvas=document.createElement('canvas');
radioCanvas.width=128;radioCanvas.height=48;
const radioTex=new THREE.CanvasTexture(radioCanvas);
function drawRadio(freq){
  const x=radioCanvas.getContext('2d');

/* ---------- 音效：底噪 + 引擎 ---------- */
let actx=null,noiseGain=null,engOsc=null,engGain=null;
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const len=actx.sampleRate*2,buf=actx.createBuffer(1,len,actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*0.35;
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
    noiseGain=actx.createGain();noiseGain.gain.value=0.012;
    src.connect(lp);lp.connect(noiseGain);noiseGain.connect(actx.destination);src.start();
    engOsc=actx.createOscillator();engOsc.type='sawtooth';engOsc.frequency.value=52;
    engGain=actx.createGain();engGain.gain.value=0;
    engOsc.connect(engGain);engGain.connect(actx.destination);engOsc.start();
  }catch(e){}
}
function staticBurst(t){
  if(!actx||!noiseGain)return;
  const now=actx.currentTime;
  noiseGain.gain.cancelScheduledValues(now);
  noiseGain.gain.setValueAtTime(0.14,now);
  noiseGain.gain.exponentialRampToValueAtTime(0.012,now+t);
}

const hud=document.getElementById('hud');

/* ---------- 循环 ---------- */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(S.started&&!S.ended)update(dt);
  render(dt);
}
function update(dt){
  const up=keys['w']||keys['arrowup'],down=keys['s']||keys['arrowdown'];
  const left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];
  const brake=down;
  if(up)S.speed+=6*dt;
  if(brake)S.speed-=13*dt;
  S.speed-=S.speed*0.035*dt;
  S.speed=Math.max(0,Math.min(27,S.speed));
  S.dist+=S.speed*dt;
  /* 变道 */
  const steerDir=(right?1:0)-(left?1:0);
  S.steer+=(steerDir*2.6-S.steer)*Math.min(1,dt*6);
  S.lateral+=S.steer*dt*(0.8+S.speed*0.06);
  if(S.lateral>3.1){S.lateral=3.1;S.steer=Math.min(S.steer,0);}
  if(S.lateral<-3.1){S.lateral=-3.1;S.steer=Math.max(S.steer,0);}
  car.position.x=S.lateral;
  camera.position.x+= (S.lateral - camera.position.x)*Math.min(1,dt*8);
  camera.position.y=1.22+Math.sin(performance.now()*0.001*7)*0.004*S.speed;
  camera.rotation.z=-S.steer*0.03;
  /* 困了：视线发飘，还会不受控地点头 */
  const dz=Math.max(0,(S.drowsy-55)/45);
  if(dz>0){const tt=performance.now()*0.001;
    camera.rotation.z+=Math.sin(tt*0.55)*0.035*dz;
    camera.rotation.x=Math.max(0,Math.sin(tt*1.05))*0.045*dz;}
  else camera.rotation.x=0;
  /* 世界滚动 */
  roadTex.offset.y+=S.speed*dt*0.05;
  const scroll=S.speed*dt;
  lamps.forEach(L=>{L.grp.position.z+=scroll;if(L.grp.position.z>16)L.grp.position.z-=LAMP_SPAN;});
  refls.forEach(m=>{m.position.z+=scroll;m.scale.z=1+Math.min(3.2,S.speed*0.13);
    if(m.position.z>10)m.position.z-=56*7.5;});
  blds.forEach(b=>{b.position.z+=scroll;if(b.position.z>14)b.position.z-=BLD_SPAN;});
  signs.forEach(g=>{g.position.z+=scroll;if(g.position.z>12)g.position.z-=SIGN_SPAN;});
  /* 车流：同向的慢慢吞吞，对向的迎面扑来 */
  traffic.forEach(c=>{
    c.z+=(S.speed+(c.dir>0?-c.v:c.v))*dt;
    c.grp.position.z=c.z;
    if(c.z>26||c.z<-420){resetTrafficCar(c,false);return;}
    if(!c.bumped&&c.z>-6.2&&c.z<-1.4&&Math.abs(S.lateral-c.lane)<1.18){
      c.bumped=true;S.bumps++;S.bumpT=1;
      S.speed=Math.max(0,c.dir>0?S.speed*0.32:0);
      S.drowsy=Math.min(100,S.drowsy+(c.dir>0?7:15));
      if(c.dir>0)toast('剐到了前车——保险杠掉了点漆。');
      else toast('迎面来车！猛地一把方向。');
    }
  });
  if(S.bumpT>0){S.bumpT-=dt*1.6;
    camera.position.x+=Math.sin(performance.now()*0.06)*0.06*Math.max(0,S.bumpT);}
  /* 雨：820–1260 m 一段雨区 */
  const inRain=S.dist>820&&S.dist<1260;
  if(inRain!==S.rain){
    S.rain=inRain;
    rain.visible=inRain;
    if(inRain&&!S.rainTold){S.rainTold=true;toast('下起雨了。R 键开雨刷。');}
    if(!inRain)toast('雨停了，路面还湿着。');
  }
  if(S.rain){
    const pa=rainGeo.attributes.position.array;
    for(let i=0;i<rainCount;i++){
      rainHead[i*3+1]-=21*dt;
      rainHead[i*3+2]+=S.speed*dt*0.9;
      if(rainHead[i*3+1]<0.1){rainHead[i*3+1]=13+Math.random()*3;
        rainHead[i*3]=(Math.random()-0.5)*34;rainHead[i*3+2]=-Math.random()*55;}
      if(rainHead[i*3+2]>2)rainHead[i*3+2]-=60;
      const x=rainHead[i*3],y=rainHead[i*3+1],z=rainHead[i*3+2];
      pa[i*6]=x;pa[i*6+1]=y;pa[i*6+2]=z;
      pa[i*6+3]=x+0.06;pa[i*6+4]=y-0.5;pa[i*6+5]=z+0.12;
    }
    rainGeo.attributes.position.needsUpdate=true;
    hemi.intensity=0.5;scene.fog.density=0.024;
  }else{
    hemi.intensity=0.72;scene.fog.density=0.019;
  }
  /* 雨刷与水膜 */
  S.wiperPhase+=dt*(S.wiperOn&&S.rain?6.2:0);
  const sweep=Math.sin(S.wiperPhase);
  const slide=Math.max(0,sweep);
  wipers.forEach(w=>{w.visible=S.rain||S.wet>0.12;w.rotation.z=1.15-slide*0.78;});
  if(S.rain)S.wet=Math.min(1,S.wet+(S.wiperOn?0.12:0.30)*dt);
  else S.wet=Math.max(0,S.wet-(S.wiperOn?0.34:0.05)*dt);
  wetPlane.material.opacity=Math.min(0.34,S.wet*0.36);
  wetPlane.material.map.offset.x=sweep*0.03;
  wetPlane.visible=S.wet>0.02;
  /* 收费站：杆抬不抬，看你速度 */
  toll.position.z=S.dist-1300;
  toll.visible=S.dist>1140&&S.dist<1360;
  if(!S.tollPassed){
    if(S.gateWait>0){
      S.gateWait-=dt;
      S.dist=Math.min(S.dist,1293);
      S.speed=Math.min(S.speed,4);
      if(S.gateWait<=0){S.tollPassed=true;toast('杆抬起来了。慢点过去。');}
    }else if(S.dist>=1293&&S.dist<1306){
      if(S.speed*3.6<=31){S.tollPassed=true;toast('收费站通过。');}
      else{S.gateWait=1.8;S.speed=0;S.dist=1291;S.drowsy=Math.min(100,S.drowsy+9);
        toast('杆没抬起来——你急刹在杆前。');}
    }
  }
  const armTarget=S.tollPassed?-1.15:0;
  toll.userData.pivot.rotation.z+=(armTarget-toll.userData.pivot.rotation.z)*Math.min(1,dt*4);
  toll.userData.lampMat.color.setHex(S.tollPassed?0x4fd07a:0xb83a2c);
  toll.userData.glow.material.color.setHex(S.tollPassed?0x66e08a:0xff5040);
  /* 挂件：变道晃，困了点头、闭眼 */
  const tired=Math.min(1,Math.max(0,(S.drowsy-55)/45));
  doll.rotation.z=-S.steer*0.12+Math.sin(performance.now()*0.0016)*0.04;
  doll.rotation.x=tired*0.36+Math.sin(performance.now()*0.0021)*0.03;
  doll.userData.eyes.forEach(e=>{e.scale.y=1-tired*0.7;});
  camera.fov=62+S.speed*0.42;camera.updateProjectionMatrix();
  /* 灯闪 */
  const t=performance.now()*0.001;
  lamps.forEach((L,i)=>{const f=(i===3&&Math.sin(t*7.3)>0.93)?0.15:1;
    L.light.intensity=L.base*f;L.grp.children[2].material.color.setRGB(f,f*0.8,f*0.55);});
  /* 困意 */
  S.drowsy+=(S.speed>4?1.15:0.35)*dt;
  S.windy=!!keys[' '];
  if(S.windy){S.drowsy-=3.4*dt;S.windTime+=dt;}
  S.drowsy=Math.max(0,Math.min(104,S.drowsy));
  S.peakDrowsy=Math.max(S.peakDrowsy,S.drowsy);
  /* 车头灯随速度微仰 */
  spots.forEach(s=>{s.target.position.z=-24-S.speed*0.6;});
  /* 里程事件 */
  if(!S.coffee&&S.dist>700){S.coffee=true;coffee.visible=true;
    toast('副驾上有一罐咖啡。按 F 喝。');}
  if(S.dist>1050&&!S._x1){S._x1=true;toast('电台开始串台，信号变差了。');}
  /* 电台 */
  lineTimer+=dt;
  if(lineTimer>8){lineTimer=0;lineIdx++;
    if(S.dist>1050&&Math.random()<0.5)setStation((S.station+1+((Math.random()*3)|0))%4);}
  radioLineEl=document.getElementById('hRadioLine');
  if(radioLineEl)radioLineEl.textContent=STATIONS[S.station].lines[lineIdx%STATIONS[S.station].lines.length];
  /* 困到睡着 */
  if(S.drowsy>=100&&!S.ended){finish('睡着了');return;}
  /* 到家 */
  if(S.dist>=S.dest){finish('到家');return;}
  /* HUD */
  elDist.textContent='里程 '+(S.dist/1000).toFixed(2)+' km';
  elSpeed.textContent=Math.round(S.speed*3.6)+' km/h';
  elDrow.firstChild.textContent='困意 '+Math.round(S.drowsy)+'%';
  const dv=Math.min(1,Math.max(0,(S.drowsy-58)/46));
  vig.style.opacity=(dv*0.9).toFixed(3);
  const ld=Math.min(1,Math.max(0,(S.drowsy-45)/55));
  lid.style.opacity=ld.toFixed(3);
  viewEl.style.filter=dv>0.02?'blur('+(dv*1.5).toFixed(2)+'px)':'';
  elFill.style.width=Math.min(100,S.drowsy)+'%';
  elFill.style.background=S.drowsy>75?'#c9564a':(S.drowsy>50?'#d8b84a':'#cfe3a0');
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('on');}
  /* 音频 */
  if(actx&&engGain)engGain.gain.value=Math.min(0.03,S.speed*0.0014);
  if(actx&&engOsc)engOsc.frequency.value=46+S.speed*1.7;
}
function render(dt){
  renderer.render(scene,camera);
}

/* ---------- 流程 ---------- */
const titleEl=document.getElementById('title'),endEl=document.getElementById('end');
const ticketEl=document.getElementById('ticket');
function startGame(){
  if(S.started)return;
  S.started=true;S.startTime=performance.now();
  titleEl.style.opacity='0';setTimeout(()=>titleEl.style.display='none',500);
  hud.classList.add('on');
  initAudio();
  toast('系好安全带。');
}
function finish(kind){
  S.ended=true;S.started=false;
  const mins=Math.max(1,Math.round((performance.now()-S.startTime)/60000*10)/10);
  ticketEl.innerHTML=
    '夜班小票 · 第 13 号试饮员<br>'+
    '──────────────<br>'+
    '里程　<b>'+(S.dist/1000).toFixed(2)+' km</b><br>'+
    '用时　<b>'+mins+' 分钟</b><br>'+
    '换台　<b>'+S.switchCount+' 次</b><br>'+
    '开窗　<b>'+Math.round(S.windTime)+' 秒</b><br>'+
    '剐蹭　<b>'+S.bumps+' 次</b><br>'+
    '最高困意　<b>'+Math.round(S.peakDrowsy)+'%</b><br>'+
    '咖啡　<b>'+(S.coffeeUsed?'喝了':'没喝')+'</b>';
  if(kind==='睡着了'){
    document.getElementById('end').querySelector('h2').textContent='在路边睡着了';
    document.getElementById('hideTip').style.display='block';
  }else{
    document.getElementById('end').querySelector('h2').textContent='到家了';
    document.getElementById('hideTip').style.display='none';
  }
  endEl.classList.add('on');
  hud.classList.remove('on');
}
document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnAgain').onclick=()=>location.reload();

/* ---------- 调试 / 自动截图 ---------- */
window.__game={
  state(){return {started:S.started,speed:+S.speed.toFixed(2),dist:Math.round(S.dist),
    lateral:+S.lateral.toFixed(2),drowsy:+S.drowsy.toFixed(1),station:S.station,
    ended:S.ended,coffeeUsed:S.coffeeUsed,windy:S.windy,
    switches:S.switchCount,rain:S.rain,wet:+S.wet.toFixed(2),wiperOn:S.wiperOn,
    tollPassed:S.tollPassed,bumps:S.bumps};},
  start:startGame,
  set(o){Object.assign(S,o);},
  input(){return {...keys};},
  trafficAt(i,z){const c=traffic[i];if(!c)return null;
    c.z=z;c.grp.position.set(c.lane,0,z);return {lane:c.lane,dir:c.dir};},
  tick(dt){if(S.started&&!S.ended)update(dt||0.016);},
  shot(name){renderer.render(scene,camera);
    return fetch('/_save?name='+(name||'outdoor')+'.png',{method:'POST',
      body:renderer.domElement.toDataURL('image/png')}).then(r=>r.text());}
};
if(q.has('shot')){
  startGame();
  S.speed=15;S.dist=Math.max(S.dist,+q.get('dist')||260);S.drowsy=+(q.get('drow')||12);
  camera.position.x=0;
  elDist.textContent='里程 '+(S.dist/1000).toFixed(2)+' km';
  elSpeed.textContent=Math.round(S.speed*3.6)+' km/h';
  elDrow.firstChild.textContent='困意 '+Math.round(S.drowsy)+'%';
  elFill.style.width=Math.min(100,S.drowsy)+'%';
  elFill.style.background=S.drowsy>75?'#c9564a':(S.drowsy>50?'#d8b84a':'#cfe3a0');
  const dv0=Math.min(1,Math.max(0,(S.drowsy-58)/46));
  vig.style.opacity=(dv0*0.9).toFixed(3);
  const ld0=Math.min(1,Math.max(0,(S.drowsy-45)/55));
  lid.style.opacity=ld0.toFixed(3);
  viewEl.style.filter=dv0>0.02?'blur('+(dv0*1.5).toFixed(2)+'px)':'';
  if(S.dist>700){S.coffee=true;coffee.visible=true;}
  if(q.has('speed'))S.speed=+q.get('speed');
  if(q.has('traffic')){
    [[0,-15],[1,-34],[4,-58]].forEach(([i,z])=>{const c=traffic[i];
      c.z=z;c.grp.position.set(c.lane,0,z);});
  }
  if(q.has('wet'))S.wet=Math.min(1,+q.get('wet')||0.85);
}
document.getElementById('btnBack').onclick=()=>{location.href='index.html';};
if(q.has('shot')){
  setTimeout(()=>{renderer.render(scene,camera);
    fetch('/_save?name='+q.get('shot')+'.png',{method:'POST',
      body:renderer.domElement.toDataURL('image/png')});},1800);
}
requestAnimationFrame(loop);
</script>
