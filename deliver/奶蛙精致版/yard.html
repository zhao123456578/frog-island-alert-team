/* 停车场已合并进 outdoor.html 的步行段（parking → board → drive 一条链路）。

(function(){
  try{
    var q=new URLSearchParams(location.search);
    var next=new URL('outdoor.html',location.href);
    ['from','route','act','diff'].forEach(function(k){if(q.has(k))next.searchParams.set(k,q.get(k));});
    if(q.has('nochaser'))next.searchParams.set('nochaser','1');
    next.searchParams.set('walk','1');
    location.replace(next.href);
  }catch(e){}
})();

  #hint{max-width:88vw;text-align:center;line-height:1.7;}

</style>

  <p>WASD 移动 · 拖动鼠标转视角 · Esc 暂停<br>走到车辆左侧驾驶门，按 E 上车</p>

</div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="assets/milkfrog_rigged_data.js"></script>
<script src="assets/frog_actor.js"></script>

<script>
'use strict';
/* 交接只读：保留主入口写入的 branch / act 等进度，不把提前离厂改成第三幕。 */
var routeQuery=new URLSearchParams(location.search);
var FROM_FACTORY=routeQuery.get('from')==='factory';
var HANDOFF=(function(){
  if(!FROM_FACTORY)return null;
  try{var data=JSON.parse(sessionStorage.getItem('mf_handoff')||'null');
    return data&&typeof data==='object'&&!Array.isArray(data)?data:null;
  }catch(e){return null;}
})();
var ROUTE=['early','investigate','wean'].includes(routeQuery.get('route'))?routeQuery.get('route'):
  (HANDOFF&&['early','investigate','wean'].includes(HANDOFF.branch)?HANDOFF.branch:'');
var EARLY=ROUTE==='early';
if(EARLY){
  document.title='提前离厂 · 停车场';
  document.querySelector('#start h1').textContent='提前离厂 · 停车场';
  document.querySelector('#start p').innerHTML='正常下班不等于解救；厂里的事仍没有答案。<br>WASD 移动 · 拖动鼠标转视角 · 左侧驾驶门按 E';
  document.getElementById('tip').textContent='远东森林 · 正常下班不等于解救';
}else if(ROUTE==='investigate'){
  document.querySelector('#start h1').textContent='调查之后 · 停车场';
  document.getElementById('tip').textContent='远东森林 · 调查之后离厂，不代表已解救奶泡';
}
var musicToggle=document.getElementById('musicToggle');
function syncSound(){
  var state=window.NightMusic.status();
  musicToggle.textContent=state.muted?'声音：已静音 · M开启':
    (state.blocked?'音乐未播放 · 点击重试':'声音：开启 · M静音');
  musicToggle.setAttribute('aria-pressed',String(state.muted));
  musicToggle.title=state.blocked?state.error:'点击或按 M 切换音乐与环境音';
  if(actx){
    var quiet=state.muted||state.hidden||state.suspended||state.handedOff||(started&&(paused||focused===false));
    var op=quiet?(actx.state==='running'?actx.suspend():null):
      (actx.state==='suspended'?actx.resume():null);
    if(op)op.catch(function(){});
  }
}
function toggleSound(){
  var muted=window.NightMusic.toggleMute();
  if(!muted&&started)window.NightMusic.start();
}
musicToggle.onclick=function(){
  var state=window.NightMusic.status();
  if(state.blocked&&!state.muted)window.NightMusic.start();
  else toggleSound();
};
window.addEventListener('nightmusicchange',syncSound);
syncSound();
/* ============ 基础 ============ */
var canvas=document.getElementById('view');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
renderer.setPixelRatio(1);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.95;
/* 阴影关掉：实测这一项在游戏里几乎看不出，却把帧率从 33 压到 29，
   低配机器上更明显。流畅不卡比那点阴影重要得多——卡就是晕的根源。 */
renderer.shadowMap.enabled=false;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x080c12);
scene.fog=new THREE.FogExp2(0x0a111a,0.014);
var camera=new THREE.PerspectiveCamera(60,16/9,0.08,260);
/* 固定内部像素密度，避免高 DPI 与抗锯齿抹平 PS1 像素边缘。 */
renderer.setSize(960,540,false);
camera.aspect=16/9;camera.updateProjectionMatrix();

/* ============ PS1 后期：色阶量化 + 4×4 Bayer 抖动 + 扫描线 + 暗角 ============
   工厂那一幕的画面质感大半来自这一步：640×360 硬像素只是"低清"，
   真正像 PS1 的是"亮部被压成十几级台阶、台阶边缘有抖动噪点"。
   场景先渲到 RT（线性空间），后处理里转回显示空间再量化，
   最后交给 CSS 的 pixelated 放大。 */
var postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var postRT=new THREE.WebGLRenderTarget(960,540,{minFilter:THREE.LinearFilter,magFilter:THREE.NearestFilter,depthBuffer:true});
var postMat=new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:null},uLevels:{value:12},uNoise:{value:0.014},uScan:{value:0.085},
    uWarp:{value:0.045},uTime:{value:0},uResolution:{value:new THREE.Vector2(960,540)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:[
    'uniform sampler2D tDiffuse;uniform float uLevels,uNoise,uScan,uWarp,uTime;uniform vec2 uResolution;',
    'varying vec2 vUv;',
    'float b2(vec2 a){a=floor(a);return fract(a.x*0.5+a.y*a.y*0.75);}',
    'float b4(vec2 a){return b2(0.5*a)*0.25+b2(a);}',
    'float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}',
    'void main(){',
    '  vec2 uv=vUv;vec2 cc=uv-0.5;float d=dot(cc,cc);uv+=cc*d*uWarp;',
    '  vec3 c=texture2D(tDiffuse,uv).rgb;',
    '  float dn=(b4(uv*uResolution)-0.5)/uLevels*0.5;',   /* 抖动放在量化之前 */
    '  float lum=dot(c,vec3(0.299,0.587,0.114));',
    '  float lq=clamp(floor(lum*uLevels+dn+0.5)/uLevels,0.0,1.0);',
    '  c=c*(lq/max(lum,0.0001));',                        /* 只量化亮度，不出彩边 */
    '  c=clamp(c,0.0,1.0);',
    '  float L2=dot(c,vec3(0.299,0.587,0.114));',
    '  c*=mix(vec3(0.90,0.96,1.06),vec3(1.05,1.01,0.95),smoothstep(0.0,0.55,L2));',
    '  float scan=sin(uv.y*uResolution.y*3.14159);c*=1.0-uScan*(0.5+0.5*scan)*0.55;',
    '  c+=(rnd(uv*uResolution)-0.5)*uNoise;',   /* 固定空间噪点：跟帧不闪 */
    '  c*=1.0-d*0.85;',
    '  gl_FragColor=vec4(clamp(c,0.0,1.0),1.0);}'
  ].join('\n'),
  depthTest:false,depthWrite:false});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));
/* PS1 顶点吸附：模型顶点按 160×90 的屏幕格对齐，近处会看到轻微"抖"，
   这是 PS1 没有浮点光栅化留下的最标志性的特征。只补一次，材质打标记跳过。 */
function ps1Snap(mat){
  if(!mat||mat.isShaderMaterial||mat.userData.ps1Snap)return;
  mat.userData.ps1Snap=1;
  mat.onBeforeCompile=function(sh){
    sh.vertexShader=sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n'+
      'vec4 ps1p=gl_Position;ps1p.xyz/=ps1p.w;'+
      'ps1p.xy=floor(ps1p.xy*160.0)/160.0;'+
      'ps1p.xyz*=ps1p.w;gl_Position=ps1p;');
  };
  mat.needsUpdate=true;
}
var ps1Tick=0;
function ps1ifyScene(){
  scene.traverse(function(o){
    if(!o.isMesh||!o.material)return;
    /* 大平面（120 m 的地面、长围墙）不能让顶点吸附：它们只有 4 个顶点，
       顶点在屏幕上被格点一推，整片地面的插值深度跟着变，会和贴地的
       标线/水洼互相抢深度——就是"地上一直闪"。小物件才做吸附。 */
    if(o.geometry){
      if(!o.geometry.boundingSphere)o.geometry.computeBoundingSphere();
      var bs=o.geometry.boundingSphere;
      if(bs&&bs.radius>18)return;
    }
    if(Array.isArray(o.material))o.material.forEach(ps1Snap);else ps1Snap(o.material);
  });
}
function renderPS1(t){
  postMat.uniforms.uTime.value=t||0;
  if((ps1Tick++&31)===0)ps1ifyScene();   /* 模型异步加载，隔一阵补一次新材质 */
  renderer.setRenderTarget(postRT);renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  postMat.uniforms.tDiffuse.value=postRT.texture;
  renderer.render(postScene,postCam);
}
/* ---- 第三人称相机（GTA 式）----
   player：角色脚下位置，角色模型就画在这儿。
   yaw/pitch：相机绕角色的角度（yaw=0 在角色正后方）。
   相机不直接贴着角色，而是隔 4.6 米、用弹簧阻尼慢慢跟过去——
   角色急停急转时画面不会跟着猛甩，这是不晕的核心。 */
var player={x:0,y:0.12,z:16.85,face:0};
var CAM_DIST=4.6,CAM_H=2.15;
var yaw=0,pitch=0.16,yawTarget=0,pitchTarget=0.16;
var camPos=new THREE.Vector3(0,CAM_H,player.z+CAM_DIST);
var camLook=new THREE.Vector3(0,1.1,player.z);
camera.position.copy(camPos);
camera.lookAt(camLook);

scene.add(new THREE.AmbientLight(0x3d4d6b,0.28));
scene.add(new THREE.HemisphereLight(0x6d82a6,0x11161d,0.30));
var moon=new THREE.DirectionalLight(0x7e9ac2,0.28);moon.position.set(-9,15,7);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-30;moon.shadow.camera.right=30;
moon.shadow.camera.top=30;moon.shadow.camera.bottom=-30;
moon.shadow.camera.near=1;moon.shadow.camera.far=70;
moon.shadow.bias=-0.0008;
scene.add(moon);

/* ============ 程序化贴图 ============ */
function mkTex(w,h,draw){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');draw(x,w,h);
  var t=new THREE.CanvasTexture(c);t.anisotropy=1;
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapNearestFilter;return t;
}
/* 水泥地：水渍、裂缝、轮胎印、旧漆线 */
var concreteTex=mkTex(256,256,function(x,w,h){
  x.fillStyle='#2b2d31';x.fillRect(0,0,w,h);
  for(var i=0;i<9000;i++){
    var g=(30+Math.random()*22)|0;
    x.fillStyle='rgba('+g+','+(g+1)+','+(g+3)+',0.55)';
    x.fillRect(Math.random()*w,Math.random()*h,2,2);
  }
  /* 大块水渍：比周围深、偏冷 */
  for(var k=0;k<26;k++){
    var cx=Math.random()*w,cy=Math.random()*h,r=8+Math.random()*26;
    var gd=x.createRadialGradient(cx,cy,0,cx,cy,r);
    gd.addColorStop(0,'rgba(16,20,26,0.55)');
    gd.addColorStop(0.7,'rgba(20,24,30,0.22)');
    gd.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gd;x.beginPath();x.arc(cx,cy,r,0,6.284);x.fill();
  }
  /* 裂缝 */
  for(var c2=0;c2<6;c2++){
    x.strokeStyle='rgba(16,18,22,0.45)';x.lineWidth=1;
    var px=Math.random()*w,py=Math.random()*h;x.beginPath();x.moveTo(px,py);
    for(var s=0;s<7;s++){px+=(Math.random()-0.5)*26;py+=(Math.random()-0.5)*26;x.lineTo(px,py);}
    x.stroke();
  }
  /* 旧漆线：褪成灰黄 */
  x.strokeStyle='rgba(150,146,118,0.20)';x.lineWidth=6;
  x.beginPath();x.moveTo(0,196);x.lineTo(w,190);x.stroke();
});
concreteTex.wrapS=concreteTex.wrapT=THREE.RepeatWrapping;
concreteTex.repeat.set(14,14);

/* 压型钢板：竖向棱 + 锈迹 */
var sidingTex=mkTex(128,128,function(x,w,h){
  x.fillStyle='#2e3135';x.fillRect(0,0,w,h);
  for(var i=0;i<w;i+=8){
    x.fillStyle='rgba(255,255,255,0.045)';x.fillRect(i,0,2,h);
    x.fillStyle='rgba(0,0,0,0.20)';x.fillRect(i+4,0,2,h);
  }
  for(var r=0;r<10;r++){
    var rx=Math.random()*w,ry=Math.random()*h*0.6;
    var gd=x.createLinearGradient(rx,ry,rx,ry+30+Math.random()*40);
    gd.addColorStop(0,'rgba(112,66,32,0.28)');
    gd.addColorStop(1,'rgba(112,66,32,0)');
    x.fillStyle=gd;x.fillRect(rx,ry,2+Math.random()*3,30+Math.random()*40);
  }
  x.fillStyle='rgba(0,0,0,0.22)';x.fillRect(0,h-16,w,16);
});
sidingTex.wrapS=sidingTex.wrapT=THREE.RepeatWrapping;
sidingTex.repeat.set(6,1.6);

/* 铁丝网：透明底 + 菱形网格 */
var chainTex=mkTex(64,64,function(x,w,h){
  x.clearRect(0,0,w,h);
  x.strokeStyle='rgba(150,160,168,0.62)';x.lineWidth=2;
  for(var i=-w;i<w*2;i+=16){
    x.beginPath();x.moveTo(i,0);x.lineTo(i+h,h);x.stroke();
    x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();
  }
});
chainTex.wrapS=chainTex.wrapT=THREE.RepeatWrapping;
chainTex.repeat.set(48,2);

/* 径向光晕 */
var glowTex=mkTex(64,64,function(x,w,h){
  var g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  g.addColorStop(0,'rgba(255,246,224,1)');
  g.addColorStop(0.28,'rgba(255,222,168,0.55)');
  g.addColorStop(1,'rgba(255,196,132,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
function glow(color,size,op,x,y,z,parent){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,
    transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  s.scale.set(size,size,1);s.position.set(x,y,z);(parent||scene).add(s);return s;
}

/* 水花涟漪 */
var ringTex=mkTex(48,48,function(x,w,h){
  x.clearRect(0,0,w,h);
  x.strokeStyle='rgba(198,216,232,0.85)';x.lineWidth=3;
  x.beginPath();x.arc(w/2,h/2,w/2-4,0,6.284);x.stroke();
});

/* 门牌 / 厂牌 */
function textTex(txt,sub,w,h,fg,bg,fs){
  return mkTex(w,h,function(x){
    x.fillStyle=bg;x.fillRect(0,0,w,h);
    x.strokeStyle='rgba(230,226,207,0.5)';x.lineWidth=3;x.strokeRect(4,4,w-8,h-8);
    x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';
    x.font='700 '+fs+'px "Microsoft YaHei",sans-serif';
    x.fillText(txt,w/2,sub?h*0.42:h/2);
    if(sub){x.font='700 '+(fs*0.5|0)+'px "Microsoft YaHei",sans-serif';
      x.fillStyle='rgba(220,214,190,0.72)';x.fillText(sub,w/2,h*0.76);}
  });
}
var signTex=textTex('员工出口','夜班  禁止返岗',256,112,'#efe9d6','#2b3641',44);
var gateSignTex=textTex('奶 厂','NO.3  DAIRY',224,88,'#f2edda','#26313b',40);
/* 安全生产标语 */
var bannerTex=mkTex(384,48,function(x,w,h){
  x.fillStyle='#8e2420';x.fillRect(0,0,w,h);
  x.fillStyle='rgba(0,0,0,0.18)';x.fillRect(0,0,w,4);x.fillRect(0,h-4,w,4);
  x.fillStyle='#f0ece0';x.textAlign='center';x.textBaseline='middle';
  x.font='700 30px "Microsoft YaHei",sans-serif';
  x.fillText('安 全 生 产 · 人 人 有 责',w/2,h/2+1);
});

/* ============ 通用 ============ */
function mat(color,extra){
  var o={color:color};if(extra)for(var k in extra)o[k]=extra[k];
  return new THREE.MeshLambertMaterial(o);
}
function box(w,h,d,m,x,y,z,parent){
  var mm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    (typeof m==='number')?mat(m):m);
  mm.position.set(x,y,z);(parent||scene).add(mm);return mm;
}
function plane(w,h,m,x,y,z,rx,parent){
  var mm=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    (typeof m==='number')?mat(m):m);
  mm.position.set(x,y,z);if(rx)mm.rotation.x=rx;(parent||scene).add(mm);return mm;

/* ============ 围栏外的树 ============
   停车场原来只有墙、柱、棚、垛——一眼就是几何体堆的。
   这里补一层建模树：锥形树干 + 分枝 + 9~12 片叶簇卡（贴图是 canvas 画的碎叶团），
   按材质合并成 2~3 个 draw call，摆在铁丝网外和砖墙外，
   从场地里看过去是"墙后面还有一片林子"，画面不再是一条硬边。 */
(function(){
  function leafTex(){
    var S=128,c=document.createElement('canvas');c.width=c.height=S;
    var x=c.getContext('2d'),pal=['#16220f','#1e2d15','#273a1a'];
    x.clearRect(0,0,S,S);
    for(var layer=0;layer<3;layer++){
      var n=[58,40,26][layer],rad=[54,40,26][layer];
      for(var i=0;i<n;i++){
        var a=Math.random()*6.283,r=Math.sqrt(Math.random())*rad;
        x.fillStyle=pal[layer];x.beginPath();
        x.ellipse(S/2+Math.cos(a)*r,S/2+Math.sin(a)*r*0.92,3.2+Math.random()*5.2-layer*0.7,
          (3.2+Math.random()*5.2-layer*0.7)*0.78,Math.random()*3,0,6.283);x.fill();
      }
    }
    var t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
    t.generateMipmaps=false;return t;
  }
  var leafMap=leafTex();
  var leafMat=new THREE.MeshLambertMaterial({map:leafMap,alphaTest:0.42,side:THREE.DoubleSide,
    color:0xa8b49a,emissive:0x0b130a});
  var barkMat=new THREE.MeshLambertMaterial({color:0x2b2219,emissive:0x080706,flatShading:true});
  var cardGeo=new THREE.PlaneGeometry(1,1);
  function tree(seed){
    var g=new THREE.Group(),r=seed;
    function rnd(){r=(r*1103515245+12345)&0x7fffffff;return r/0x7fffffff;}
    var th=0.5+rnd()*0.12;
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.026,0.062,th,6),barkMat);
    trunk.position.y=th/2;g.add(trunk);
    for(var i=0;i<4;i++){
      var a=i/4*6.283+rnd()*0.6,top=th*0.55+rnd()*th*0.35;
      var bx=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.03,0.30,5),barkMat);
      bx.position.set(Math.cos(a)*0.10,top+0.10,Math.sin(a)*0.10);
      bx.rotation.z=-Math.cos(a)*0.6;bx.rotation.x=Math.sin(a)*0.6;g.add(bx);
    }
    for(var k=0;k<10;k++){
      var ang=k/10*6.283+rnd()*0.8,rad=0.16+rnd()*0.17;
      var m=new THREE.Mesh(cardGeo,leafMat);
      m.position.set(Math.cos(ang)*rad,0.60+rnd()*0.30,Math.sin(ang)*rad);
      m.scale.set(0.40+rnd()*0.16,0.38+rnd()*0.15,1);
      m.rotation.set((rnd()-0.5)*0.5,-ang+Math.PI/2,(rnd()-0.5)*0.35);
      g.add(m);
    }
    var top=new THREE.Mesh(cardGeo,leafMat);
    top.position.y=0.95;top.scale.set(0.34,0.30,1);top.rotation.y=rnd()*3;g.add(top);
    /* 合并成两个网格（叶 / 干） */
    g.updateMatrixWorld(true);
    var buckets={};
    g.traverse(function(o){
      if(!o.isMesh)return;
      var key=o.material===leafMat?'leaf':'bark';
      var geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
      geo.applyMatrix4(o.matrixWorld);
      (buckets[key]=buckets[key]||[]).push(geo);
    });
    var out=new THREE.Group();
    Object.keys(buckets).forEach(function(key){
      var parts=buckets[key],n=0;
      parts.forEach(function(gg){n+=gg.attributes.position.count;});
      var pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2),o3=0,o2=0;
      parts.forEach(function(gg){
        pos.set(gg.attributes.position.array,o3);
        if(gg.attributes.normal)nor.set(gg.attributes.normal.array,o3);
        if(gg.attributes.uv)uv.set(gg.attributes.uv.array,o2);
        o3+=gg.attributes.position.array.length;o2+=gg.attributes.uv?gg.attributes.uv.array.length:0;
        gg.dispose();
      });
      var geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
      geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));
      if(o2)geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
      out.add(new THREE.Mesh(geo,key==='leaf'?leafMat:barkMat));
    });
    return out;
  }
  var proto=tree(7);
  function plant(x,z,h,rot){
    var t=proto.clone(true);
    t.position.set(x,0,z);t.scale.setScalar(h);t.rotation.y=rot||0;
    scene.add(t);return t;
  }
  /* 铁丝网外一排（能越过 2.2 m 的网看过去） */
  for(var i=0;i<16;i++){
    var x=-26+i*3.4+(Math.random()-0.5)*1.6;
    var z=-16.5-Math.random()*13;
    plant(x,z,6.5+Math.random()*4.5,Math.random()*6.28);
  }
  /* 左侧砖墙外两棵高的，压住画面左边 */
  plant(-25.5,6,9.5,0.6);plant(-28,-3,8.2,2.1);
  /* 门卫室后面一丛低的 */
  plant(-19,-15,4.2,1.2);plant(-16.4,-16.5,3.6,2.6);
})();

/* 复用驾驶页的无依赖 OBJ 扇形三角化。旋转/缩放烘入顶点，UV 不动。
   只把左侧门矩形从原三角面裁下，关门时原样拼合；整车从不隐藏/换壳。
   顶点 [x,y,z,u,v] 的裁剪插值同时保留贴图，不在整块侧板上叠假门。 */
function parseYardCar(text){
  var vs=[],uvs=[],faces=[];
  function index(raw,n){return raw<0?n+raw:raw-1;}
  text.split(/\r?\n/).forEach(function(raw){
    var p=raw.trim().split(/\s+/);
    if(p[0]==='v')vs.push([+p[1],+p[2],+p[3]]);
    else if(p[0]==='vt')uvs.push([+p[1],+(p[2]||0)]);
    else if(p[0]==='f'&&p.length>=4){
      var f=p.slice(1).map(function(s){var q=s.split('/');return {v:index(+q[0],vs.length),t:q[1]?index(+q[1],uvs.length):-1};});
      for(var j=1;j<f.length-1;j++)faces.push([f[0],f[j],f[j+1]]);
    }
  });
  if(!vs.length||!faces.length)throw new Error('OBJ 没有有效面');
  var min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];
  vs.forEach(function(v){v.forEach(function(n,i){if(!Number.isFinite(n))throw new Error('OBJ 顶点无效');min[i]=Math.min(min[i],n);max[i]=Math.max(max[i],n);});});
  if(max.some(function(n,i){return n<=min[i];}))throw new Error('OBJ 包围盒退化');
  var scale=CAR_WIDTH/(max[0]-min[0]),cx=(min[0]+max[0])/2,cz=(min[2]+max[2])/2;
  carSize.height=(max[1]-min[1])*scale;carSize.length=(max[2]-min[2])*scale;
  var body=[],door=[];
  function clip(poly,axis,bound,sign){
    var yes=[],no=[];
    for(var i=0;i<poly.length;i++){
      var a=poly[i],b=poly[(i+1)%poly.length],da=(a[axis]-bound)*sign,db=(b[axis]-bound)*sign;
      (da>=0?yes:no).push(a);
      if((da>=0)!==(db>=0)){
        var t=da/(da-db),v=a.map(function(n,k){return n+(b[k]-n)*t;});yes.push(v);no.push(v);
      }
    }
    return [yes,no];
  }
  function emit(poly,out){for(var i=1;i<poly.length-1;i++)out.push(poly[0],poly[i],poly[i+1]);}
  faces.forEach(function(f){
    var tri=f.map(function(q){
      var v=vs[q.v],uv=uvs[q.t];if(!v||!uv)throw new Error('OBJ 顶点或 UV 索引无效');
      return [-(v[0]-cx)*scale,(v[1]-min[1])*scale,-(v[2]-cz)*scale,uv[0],uv[1]];
    });
    if(!tri.every(function(v){return v[0]<-0.80;})){emit(tri,body);return;}
    var inside=tri;
    [[1,0.47,1],[1,1.76,-1],[2,-1.84,1],[2,-0.48,-1]].forEach(function(c){
      if(!inside.length)return;
      var parts=clip(inside,c[0],c[1],c[2]);emit(parts[1],body);inside=parts[0];
    });
    emit(inside,door);
  });
  if(door.length<3)throw new Error('未找到左侧驾驶门面');
  function geometry(vertices,pivot){
    var pos=[],uv=[];
    vertices.forEach(function(v){pos.push(v[0]-pivot.x,v[1]-pivot.y,v[2]-pivot.z);uv.push(v[3],v[4]);});
    var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.computeVertexNormals();g.computeBoundingBox();return g;
  }
  return {body:geometry(body,new THREE.Vector3()),door:geometry(door,driverDoor.position)};
}

var boardingKeys=[

  {u:0.16,l:[1.06,-1.38,0.25,0.12],   r:[-0.18,-0.10,0.22,-0.18], lean:-0.14},

  {u:0.68,l:[1.05,-1.58,0.34,0.18],   r:[0.68,-0.70,0.02,0],      lean:-0.32},
  {u:0.84,l:[1.52,-1.68,0.22,0.10],   r:[1.38,-1.36,0.03,0],      lean:-0.20},
  {u:1,   l:[1.38,-1.32,0,0],         r:[1.38,-1.32,0,0],         lean:0}
];
function boardingStage(u){return u<0.34?'left-step':u<0.60?'right-threshold':u<0.84?'left-tuck':'settle';}
function boardingPose(u){
  var i=1;while(i<boardingKeys.length-1&&u>boardingKeys[i].u)i++;
  var a=boardingKeys[i-1],b=boardingKeys[i],t=smooth((u-a.u)/(b.u-a.u));
  var settle=smooth((u-0.76)/0.24),angles={};
  ['L','R'].forEach(function(side){
    var leg=side==='L'?'l':'r';
    ['Thigh','Shin','Foot','Toe'].forEach(function(name,j){
      angles[name+side]=[a[leg][j]+(b[leg][j]-a[leg][j])*t,name==='Thigh'?(side==='L'?-0.05:0.05)*settle:0];
    });
    angles['UpperArm'+side]=[0.26*settle,(side==='L'?-0.12:0.12)*settle];
    angles['LowerArm'+side]=[0.38*settle,0];
  });
  angles.Chest=[a.lean+(b.lean-a.lean)*t,0];angles.Head=[-0.10*Math.sin(u*Math.PI),0];
  return {angles:angles,settle:settle};
}

/* ============ 音：雨声 ============ */
var actx=null,rainGain=null,noiseBuffer=null;
function startAudio(){
  if(actx){syncSound();return;}
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    var len=actx.sampleRate*2;
    var buf=actx.createBuffer(1,len,actx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*0.5;
    noiseBuffer=buf;
    var src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=0.5;
    var lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;
    rainGain=actx.createGain();rainGain.gain.value=0.0;
    src.connect(bp);bp.connect(lp);lp.connect(rainGain);rainGain.connect(actx.destination);
    src.start();
    rainGain.gain.linearRampToValueAtTime(0.055,actx.currentTime+1.5);
    syncSound();
  }catch(e){}
}

window.addEventListener('pointerdown',unlockAudio);
function yardSound(kind){
  if(!actx||actx.state!=='running'||window.NightMusic.status().muted||isPaused())return;
  var now=actx.currentTime,dur=kind==='open'?0.48:kind==='close'?0.26:0.12;
  var gain=actx.createGain(),filter=actx.createBiquadFilter(),noise=actx.createBufferSource();
  noise.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.value=kind==='step'?650:1900;
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(kind==='close'?0.12:0.045,now+0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  noise.connect(filter);filter.connect(gain);gain.connect(actx.destination);
  noise.start(now);noise.stop(now+dur);
  var osc=actx.createOscillator(),og=actx.createGain();osc.type=kind==='open'?'triangle':'sine';
  osc.frequency.setValueAtTime(kind==='open'?310:kind==='handle'?650:110,now);
  osc.frequency.exponentialRampToValueAtTime(kind==='open'?135:55,now+dur);
  og.gain.setValueAtTime(0.028,now);og.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  osc.connect(og);og.connect(actx.destination);osc.start(now);osc.stop(now+dur);
  noise.onended=function(){noise.disconnect();filter.disconnect();gain.disconnect();};
  osc.onended=function(){osc.disconnect();og.disconnect();};
}
function pauseChanged(){clearKeys();if(clock)clock.getDelta();window.NightMusic.suspend(paused||!focused);syncSound();}

  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','e'].indexOf(key)<0)return;

/* 拖动环视：用 movementX/Y 而不是 clientX 差值——
   指针划出画布再回来不会因为锚点过期而猛跳；配合 pointer capture，
   拖到窗口外也还能继续转。只有左键、只有按住时才转，松手后指针立刻能点按钮。 */
canvas.addEventListener('pointerdown',function(e){
  if(!canControl()||e.button!==0)return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;

  window.addEventListener(t,function(){if(!dragging)return;dragging=false;canvas.classList.remove('grabbing');});

  if(!dragging||!canControl())return;
  var dx=e.movementX||0,dy=e.movementY||0;
  if(!dx&&!dy)return;
  yawTarget-=dx*0.0024;pitchTarget-=dy*0.0014;
  pitchTarget=clamp(pitchTarget,-0.18,0.55);lastX=e.clientX;lastY=e.clientY;

/* 进入游戏后锁住指针：画面上没有光标，直接滑鼠标转头；Esc 释放。
   锁定失败（预览小窗）就退回上面"按住左键拖动"的方式。 */
var plock=false,lockGrace=0;
canvas.addEventListener('click',function(){
  if(!canControl()||phase!=='free'||document.pointerLockElement===canvas)return;
  try{var p=canvas.requestPointerLock();if(p&&p.catch)p.catch(function(){});}catch(e){}

  if(!plock||!canControl())return;
  if(performance.now()<lockGrace)return;
  var dx=e.movementX||0,dy=e.movementY||0;
  if(!dx&&!dy)return;
  if(Math.abs(dx)>200||Math.abs(dy)>200)return;
  yawTarget-=dx*0.0024;pitchTarget-=dy*0.0014;
  pitchTarget=clamp(pitchTarget,-0.18,0.55);

/* 行走时按真实长宽膨胀角色半径；不是原来的圆形推开（车头/车尾会漏）。 */
function blocksCar(x,z){return Math.abs(x-carG.position.x)<CAR_WIDTH/2+HERO_RADIUS&&Math.abs(z-carG.position.z)<carSize.length/2+HERO_RADIUS;}
function movePlayer(dx,dz){
  var x=clamp(player.x+dx,-19,19),z=clamp(player.z+dz,-12.5,15.9);
  if(!blocksCar(x,player.z))player.x=x;
  if(!blocksCar(player.x,z))player.z=z;

  return carLoaded&&x<=-CAR_WIDTH/2-HERO_RADIUS&&x>=-2.55&&z>=-1.70&&z<=0.40&&
    Math.hypot(x-DOOR.handle.x,z-DOOR.handle.z)<=1.65;

function drivingURL(){

     这样拉门、坐进驾驶位、黑场这整段过场画面上都没有光标在飘。 */
  try{if(document.pointerLockElement!==canvas&&canvas.requestPointerLock){
    var lp=canvas.requestPointerLock();if(lp&&lp.catch)lp.catch(function(){});
  }}catch(e){}

/* ============ 主循环与过场时序 ============ */
var clock=new THREE.Clock(),tAll=0;
function updateYard(dt){
  tAll+=dt;
  var walking=false,pose='idle',boarding=null;
  if(phase==='free'){
    yaw+=(yawTarget-yaw)*(1-Math.exp(-dt*6.5));pitch+=(pitchTarget-pitch)*(1-Math.exp(-dt*6.5));
    var fx=-Math.sin(yaw),fz=-Math.cos(yaw),mx=0,mz=0;
    if(keys.w||keys.arrowup){mx+=fx;mz+=fz;}if(keys.s||keys.arrowdown){mx-=fx;mz-=fz;}
    if(keys.a||keys.arrowleft){mx+=fz;mz-=fx;}if(keys.d||keys.arrowright){mx-=fz;mz+=fx;}
    var len=Math.hypot(mx,mz),oldX=player.x,oldZ=player.z;
    if(len){movePlayer(mx/len*3*dt,mz/len*3*dt);faceToward(mx,mz,dt);}
    walking=Math.hypot(player.x-oldX,player.z-oldZ)>0.0001;
    label(atDriverDoor()?'左侧驾驶门 · E 拉开车门并入座':'WASD 移动 · 拖动视角 · 到车辆左侧驾驶门按 E · Esc 暂停');
    camPos.lerp(followPosition(),1-Math.exp(-dt*5));
    camLook.lerp(new THREE.Vector3(player.x,1.1,player.z),1-Math.exp(-dt*7));
  }else if(durations[phase]){
    phaseTime=Math.min(durations[phase],phaseTime+dt);
    var u=phaseTime/durations[phase],e=smooth(u);
    if(phase==='exit'){
      var walkU=smooth((phaseTime-0.35)/2.9);
      setPlayer(new THREE.Vector3(0.8*walkU,0.12*(1-smooth(walkU*5)),16.85-4.95*walkU));
      walking=phaseTime>0.35&&phaseTime<3.25;faceToward(0.8,-4.95,dt);
      fadeEl.style.opacity=String(1-smooth(phaseTime/0.9));
      label('离开员工门 · 雨中的远东旧厂区');
      var join=smooth((phaseTime-2.1)/1.7);
      camPos.lerpVectors(new THREE.Vector3(-3.2,2.3,12.3),followPosition(),join);
      camLook.set(player.x,1.1,player.z);
      if(u===1){player.y=0;phaseTo('free');}
    }else if(phase==='approach'){
      var wait=carWorld(DOOR.wait),v=new THREE.Vector3().lerpVectors(boardFrom,wait,e);
      walking=u<0.94&&boardFrom.distanceTo(wait)>0.06;setPlayer(v);
      if(u<0.75&&boardFrom.distanceTo(wait)>0.06)faceToward(wait.x-boardFrom.x,wait.z-boardFrom.z,dt);
      else faceToward(DOOR.handle.x-DOOR.wait.x,DOOR.handle.z-DOOR.wait.z,dt);
      /* 镜头绕车外圆弧，而非从任意自由机位直线穿过车壳。 */
      var off=boardCam.clone().sub(carG.position),a=Math.atan2(off.x,off.z),target=Math.atan2(-3.5,1.15);
      var turn=Math.atan2(Math.sin(target-a),Math.cos(target-a)),angle=a+turn*e;
      var safeR=Math.min((CAR_WIDTH/2+0.22)/Math.max(0.001,Math.abs(Math.sin(angle))),
        (carSize.length/2+0.22)/Math.max(0.001,Math.abs(Math.cos(angle))));
      var r=Math.max(safeR,Math.hypot(off.x,off.z)*(1-e)+3.7*e);
      camPos.set(carG.position.x+Math.sin(angle)*r,boardCam.y+(1.95-boardCam.y)*e,carG.position.z+Math.cos(angle)*r);
      camLook.lerpVectors(boardLook,carWorld(new THREE.Vector3(-1.1,1.05,-0.8)),e);
      label('上车 1/6 · 靠近左侧门把手');
      if(u===1){phaseTo('open');yardSound('handle');}
    }else if(phase==='open'){
      faceToward(DOOR.handle.x-DOOR.wait.x,DOOR.handle.z-DOOR.wait.z,dt);
      driverDoor.rotation.y=DOOR.angle*smooth((u-0.12)/0.88);
      label('上车 2/6 · 拉开驾驶门');
      if(phaseTime-dt<0.18&&phaseTime>=0.18)yardSound('open');
      if(u===1)phaseTo('step');
    }else if(phase==='step'){
      /* 保留 wait → 0.34 m step → seat 锚点；先抬膝才升高，收后腿后才坐稳。 */
      var wait=carWorld(DOOR.wait),step=carWorld(DOOR.step),seat=carWorld(DOOR.seat);
      var v=u<0.42?new THREE.Vector3().lerpVectors(wait,step,smooth(u/0.42)):
        new THREE.Vector3().lerpVectors(step,seat,smooth((u-0.42)/0.48));
      if(u<0.42)v.y=wait.y+(step.y-wait.y)*smooth((u-0.16)/0.26);
      setPlayer(v);var forward=u<0.30||u>0.82;faceToward(forward?0:1,forward?-1:0,dt);
      boarding=boardingPose(u);
      [0.34,0.64].forEach(function(contact){
        if(phaseTime-dt<durations.step*contact&&phaseTime>=durations.step*contact)yardSound('step');
      });
      label('上车 3/6 · '+(u<0.34?'左脚抬膝落脚':u<0.60?'右脚跨过门槛':u<0.84?'收进左腿，俯身进舱':'双脚落稳，坐进驾驶座'));
      if(u===1){boardCam=camPos.clone();boardLook=camLook.clone();phaseTo('seat');}
    }else if(phase==='seat'){
      pose='sit';faceToward(0,-1,dt);
      var outside=carWorld(new THREE.Vector3(-1.28,1.53,-1.10)),eye=carWorld(DOOR.eye);
      if(u<0.56)camPos.lerpVectors(boardCam,outside,smooth(u/0.56));
      else camPos.lerpVectors(outside,eye,smooth((u-0.56)/0.44));
      camLook.lerpVectors(boardLook,carWorld(new THREE.Vector3(-1.8,1.2,-1.7)),e);
      /* 相机到达门洞、切到本人视点才收起奶蛙，不在车外凭空消失。 */
      hero.visible=u<0.60;label('上车 4/6 · 镜头落到驾驶座');
      if(u===1){boardLook=camLook.clone();phaseTo('close');if(rainGain&&actx)rainGain.gain.setTargetAtTime(0.028,actx.currentTime,0.45);}
    }else if(phase==='close'){
      pose='sit';driverDoor.rotation.y=DOOR.angle*(1-e);camPos.copy(carWorld(DOOR.eye));
      var lookDoor=carWorld(new THREE.Vector3(-1.8,1.2,-1.7));
      if(u<0.42)camLook.lerpVectors(boardLook,lookDoor,smooth(u/0.42));
      else camLook.lerpVectors(lookDoor,carWorld(new THREE.Vector3(-0.44,1.42,-8)),smooth((u-0.42)/0.58));
      label('上车 5/6 · 关好驾驶门');
      if(u===1){yardSound('close');phaseTo('black');}
    }else if(phase==='black'){
      pose='sit';fadeEl.style.opacity=String(smooth(phaseTime/0.5));label('上车 6/6 · 已入座，驶向林间道路');
      capEl.textContent=ROUTE==='wean'?'带着奶泡的最后一句话 · 离开旧厂区':'正常下班不等于解救 · 工厂仍在身后';
      if(phaseTime>0.3)capEl.classList.add('on');
      if(u===1){phaseTo('navigating');window.NightMusic.handoff();location.href=drivingURL().href;}
    }
  }
  if(walking){stepClock+=dt;if(stepClock>=0.46){stepClock=0;yardSound('step');}}
  else stepClock=0;
  hero.position.set(player.x,player.y,player.z);hero.rotation.y=player.face;
  if(heroActor){
    poseBones.forEach(function(p){p.q.copy(p.bone.quaternion);});
    heroActor.update(dt,pose==='sit'?'sit':walking?'walk':'idle',1);
    if(phase==='open'){
      var reach=smooth(phaseTime/0.24)*(1-smooth((phaseTime-0.72)/0.43));
      poseBones.forEach(function(p){
        var amount=p.name==='UpperArmR'?1.0:p.name==='LowerArmR'?0.5:p.name==='Chest'?-0.10:0;
        if(amount)p.bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(p.axis,amount*reach));
      });
    }
    if(boarding){
      /* 末帧内部 rig 偏移须与 sit 一致，避免入座瞬间身体跳动。 */
      heroActor.root.children[0].position.y=-HERO_HEIGHT*0.13*boarding.settle;
      poseBones.forEach(function(p){
        var angle=boarding.angles[p.name];if(!angle)return;
        p.bone.quaternion.copy(p.rest)
          .multiply(new THREE.Quaternion().setFromAxisAngle(p.axis,angle[0]))
          .multiply(new THREE.Quaternion().setFromAxisAngle(p.sideAxis,angle[1]));
      });
    }
    /* 保留原有 slerp 速率；用独立的上一帧副本插值，避免输出与目标别名使目标被覆盖。 */
    poseBones.forEach(function(p){p.bone.quaternion.copy(p.q.slerp(p.bone.quaternion,1-Math.exp(-dt*14)));});
  }
  camera.position.copy(camPos);camera.lookAt(camLook);
  /* 雨始终更新；位移方向与雨丝斜率一致，不只是把竖雨画斜。 */
  var pa=rg.attributes.position.array;
  for(var i=0;i<RN;i++){
    var dy=rv[i]*dt,j=i*6,dx=dy*RAIN_WIND_X,dz=dy*RAIN_WIND_Z;
    pa[j]+=dx;pa[j+1]-=dy;pa[j+2]+=dz;
    pa[j+3]+=dx;pa[j+4]-=dy;pa[j+5]+=dz;
    if(pa[j+4]<0)resetRainDrop(i,16+pa[j+4]);
  }
  rg.attributes.position.needsUpdate=true;
  /* 水花先溅起，再留下逐渐扩散消失的涟漪；复用顶点和材质。 */
  for(var k=0;k<ripples.length;k++){
    var r=ripples[k];r.t+=dt;
    if(r.t>r.dur)resetRipple(r);
    var kk=r.t/r.dur;
    r.m.material.opacity=0.42*(1-kk);
    var s=0.3+kk*1.5;r.m.scale.set(s,s,1);
    var pop=Math.max(0,1-kk/0.38),height=Math.sin(Math.min(1,kk/0.38)*Math.PI)*0.16;
    for(var sp=0;sp<3;sp++){
      var a=sp*Math.PI*2/3+k,spread=0.03+kk*0.24,idx=k*18+sp*6;
      var sx=r.m.position.x+Math.cos(a)*spread,sz=r.m.position.z+Math.sin(a)*spread;
      splashPos[idx]=sx;splashPos[idx+1]=0.022+height;splashPos[idx+2]=sz;
      splashPos[idx+3]=sx+Math.cos(a)*0.045*pop;
      splashPos[idx+4]=0.022+height+0.08*pop;splashPos[idx+5]=sz+Math.sin(a)*0.045*pop;
    }
  }
  splashGeo.attributes.position.needsUpdate=true;
  /* 烟囱顶的红灯一明一暗 */
  stackLight.material.opacity=0.12+0.18*(0.5+0.5*Math.sin(tAll*1.5));
}
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,clock.getDelta());
  if(!isPaused())updateYard(dt);
  else if(started)label('已暂停 · '+(paused?'Esc 继续':'返回此窗口继续'));
  renderPS1(tAll);
}
function resize(){
  /* 内部分辨率从 640×360 提到 960×540：PS1 的味道交给量化+抖动+顶点吸附，
     不再靠"分辨率低"来凑，画面就不糊了。仍然锁 16:9 且 1 像素比。 */
  var w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),s=Math.min(960/w,540/h);
  renderer.setSize(Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)),false);
  var sz=new THREE.Vector2();renderer.getSize(sz);
  postRT.setSize(Math.max(1,sz.x),Math.max(1,sz.y));
  postMat.uniforms.uResolution.value.set(Math.max(1,sz.x),Math.max(1,sz.y));
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
/* 只读快照 + 安全传送/有限步进；不暴露可写场景节点，不改交接存档。
   teleport('driver') 或 teleport(x,z) 仅自由行走有效；pump(秒) 最多 30 秒，
   按 1/60 秒推进同一状态机，暂停/隐藏时拒绝；上车后 pump 可真实触发导航。 */
function yardSnapshot(){
  function point(v){return Object.freeze({x:v.x,y:v.y||0,z:v.z});}
  var bones={};
  poseBones.forEach(function(p){
    if(!/^(Thigh|Shin|Foot|Toe)[LR]$|^Chest$/.test(p.name))return;
    var q=p.rest.clone().invert().multiply(p.bone.quaternion);
    bones[p.name]=Object.freeze({angle:2*Math.atan2(q.x*p.axis.x+q.y*p.axis.y+q.z*p.axis.z,q.w),
      world:point(p.bone.getWorldPosition(new THREE.Vector3()))});
  });
  return Object.freeze({phase:phase,time:phaseTime,durations:durations,started:started,ready:assetsReady,
    boardingStage:phase==='step'?boardingStage(phaseTime/durations.step):phase==='seat'?'seated':null,
    bones:Object.freeze(bones),visual:Object.freeze({width:canvas.width,height:canvas.height,
      pixelRatio:renderer.getPixelRatio(),antialias:false,filter:'nearest',exposure:renderer.toneMappingExposure,
      rainCount:RN,rainOpacity:rain.material.opacity,splashCount:ripples.length}),
    heroReady:!!heroActor,carReady:carLoaded,error:loadError,paused:isPaused(),inputLocked:!canControl(),
    leaving:leaving,canBoard:canControl()&&atDriverDoor(),heroVisible:hero.visible,player:point(player),
    camera:point(camPos),look:point(camLook),doorAngle:driverDoor.rotation.y,
    driverWait:point(carWorld(DOOR.wait)),driverHandle:point(carWorld(DOOR.handle)),driverSeat:point(carWorld(DOOR.eye)),
    car:Object.freeze({x:carG.position.x,z:carG.position.z,width:carSize.width,height:carSize.height,length:carSize.length,forward:'-Z',obj:CAR_OBJ_URL,texture:CAR_TEXTURE_URL}),
    route:ROUTE,fromFactory:FROM_FACTORY,targetURL:drivingURL().href,forest:Object.freeze({pines:pineCount,birches:birchCount})});
}
Object.defineProperty(window,'__yard',{value:Object.freeze({
  get state(){return yardSnapshot();},
  teleport:function(x,z){
    if(!canControl())return false;
    if(x==='driver'){var v=carWorld(DOOR.wait);x=v.x;z=v.z;}
    if(!Number.isFinite(x)||!Number.isFinite(z)||x<-19||x>19||z<-12.5||z>15.9||blocksCar(x,z))return false;
    clearKeys();player.x=x;player.y=0;player.z=z;hero.position.set(x,0,z);
    setView(followPosition(),new THREE.Vector3(x,1.1,z));return yardSnapshot();
  },
  pump:function(seconds){
    if(isPaused()||!Number.isFinite(seconds)||seconds<0||seconds>30)return false;
    var n=Math.ceil(seconds*60);
    for(var i=0;i<n&&phase!=='navigating';i++)updateYard(Math.min(1/60,seconds-i/60));
    renderPS1(tAll);clock.getDelta();return yardSnapshot();
  }
}),writable:false,configurable:false});
goEl.onclick=requestStart;
if(FROM_FACTORY||routeQuery.has('start'))requestStart();
loop();
</script>
