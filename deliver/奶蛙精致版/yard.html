<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:,">
<title>奶厂 · 停车场</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:Consolas,"Courier New",monospace;}
  #view{width:100%;height:100%;display:block;image-rendering:pixelated;
    image-rendering:crisp-edges;}
  /* 颗粒/暗角/扫描线/低色阶全部由统一 PSX 后处理着色器负责（与工厂、公路同一套），
     不再叠 CSS 遮罩——两层叠加会把暗部压死、扫描线摩尔纹。 */
  #hud{position:fixed;inset:0;pointer-events:none;}
  #hint{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);
    color:#cfe3a0;background:rgba(8,10,8,.78);border:1px solid #3c4a2e;
    padding:9px 18px;font-size:12px;letter-spacing:.1em;opacity:0;transition:opacity .35s;}
  #hint.on{opacity:1;}
  #tip{position:fixed;left:50%;top:8%;transform:translateX(-50%);color:#8fa878;
    font-size:11px;letter-spacing:.24em;opacity:.75;}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;
    transition:opacity .5s;z-index:50;}
  #cap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    color:#d8d3bd;font-size:13px;letter-spacing:.34em;opacity:0;
    transition:opacity .5s;z-index:51;white-space:nowrap;}
  #cap.on{opacity:.9;}
  #start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#161a14,#08080c 75%);}
  #start .box{text-align:center;color:#c8c4b0;}
  #start h1{margin:0 0 10px;font-size:22px;letter-spacing:.2em;color:#e6e2cf;}
  #start p{margin:0 0 22px;font-size:11px;letter-spacing:.16em;color:#7f826f;line-height:2;}
  #start button{font-family:inherit;cursor:pointer;background:#1a1c17;color:#e6e2cf;
    border:1px solid #6a6a55;padding:10px 26px;font-size:12px;letter-spacing:.16em;}
  #start button:hover{background:#262a1c;border-color:#86c24b;color:#eaffd0;}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="tip">奶厂 · 三号车间 · 停车场</div>
<div id="hint">按 E 上车</div>
<div id="fade"></div>
<div id="cap">02:47 · 上车</div>
<div id="start"><div class="box">
  <h1>奶 厂 · 停 车 场</h1>
  <p>WASD 移动 · 拖动鼠标转视角<br>走到车边，按 E 上车</p>
  <button id="btnGo">走出厂房</button>
</div></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="assets/nailong_data.js"></script>
<script>
'use strict';
/* ============ 基础 ============ */
var canvas=document.getElementById('view');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
renderer.setPixelRatio(1);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.LinearToneMapping;
renderer.toneMappingExposure=0.92;
/* 阴影关掉：实测这一项在游戏里几乎看不出，却把帧率从 33 压到 29，
   低配机器上更明显。流畅不卡比那点阴影重要得多——卡就是晕的根源。 */
renderer.shadowMap.enabled=false;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x04080b);
scene.fog=new THREE.FogExp2(0x0a1115,0.0190);
var camera=new THREE.PerspectiveCamera(60,16/9,0.08,260);
/* 固定 640×360 内部分辨率，CSS 拉伸铺满窗口。
   实测软件渲染下 1250 宽只有 12 帧、960 宽 19 帧、640 宽 33 帧，
   只有 640 才流畅。材质/车灯/雨那些质感照旧保留，只是渲染底子用低分辨率。 */
renderer.setSize(640,360,false);
camera.aspect=16/9;camera.updateProjectionMatrix();
/* ---- 第三人称相机（GTA 式）----
   player：角色脚下位置，角色模型就画在这儿。
   yaw/pitch：相机绕角色的角度（yaw=0 在角色正后方）。
   相机不直接贴着角色，而是隔 4.6 米、用弹簧阻尼慢慢跟过去——
   角色急停急转时画面不会跟着猛甩，这是不晕的核心。 */
var player={x:0,z:8.4,face:0};
var CAM_DIST=4.6,CAM_H=2.15;
var yaw=0,pitch=0.16,yawTarget=0,pitchTarget=0.16;
var camPos=new THREE.Vector3(0,CAM_H,player.z+CAM_DIST);
var camLook=new THREE.Vector3(0,1.1,player.z);
camera.position.copy(camPos);
camera.lookAt(camLook);

/* ============ 统一 PSX 后处理（与工厂/公路同一套） ============
   场景先渲进 640×360 的 RT，再过一遍全屏着色器：
   4×4 Bayer 抖动 + 24 级亮度量化（低色阶）、冷阴影/暖高光分色调、
   扫描线、颗粒、暗角、轻微桶形畸变。之前是 CSS 遮罩叠 canvas 颗粒，
   三场景观感对不齐，现在整条链和工厂 index.html 完全一致。 */
var POST_W=640,POST_H=360;
var rt=new THREE.WebGLRenderTarget(POST_W,POST_H,{
  minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,depthBuffer:true});
var postScene=new THREE.Scene();
var postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var postMat=new THREE.ShaderMaterial({
  uniforms:{
    tDiffuse:{value:null},
    uLevels:{value:24},uNoise:{value:0.02},uScan:{value:0.04},uWarp:{value:0.05},
    uTime:{value:0},uResolution:{value:new THREE.Vector2(POST_W,POST_H)}
  },
  vertexShader:
    'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}',
  fragmentShader:[
    'uniform sampler2D tDiffuse;',
    'uniform float uLevels,uNoise,uScan,uWarp,uTime;',
    'uniform vec2 uResolution;varying vec2 vUv;',
    'float rand(vec2 co){return fract(sin(dot(co.xy,vec2(12.9898,78.233)))*43758.5453);}',
    'float b2(vec2 a){a=floor(a);return fract(a.x*0.5+a.y*a.y*0.75);}',
    'float b4(vec2 a){return b2(0.5*a)*0.25+b2(a);}',
    'void main(){',
    '  vec2 uv=vUv;vec2 cc=uv-0.5;float d=dot(cc,cc);uv+=cc*d*uWarp;',
    '  vec3 c=texture2D(tDiffuse,uv).rgb;',
    '  float dn=(b4(uv*uResolution)-0.5)/uLevels;',
    '  float lum=dot(c,vec3(0.299,0.587,0.114));',
    '  float lq=clamp(floor(lum*uLevels+dn+0.5)/uLevels,0.0,1.0);',
    '  c=c*(lq/max(lum,0.0001));c=clamp(c,0.0,1.0);',
    '  float L2=dot(c,vec3(0.299,0.587,0.114));',
    '  c*=mix(vec3(0.90,0.96,1.06),vec3(1.05,1.01,0.95),smoothstep(0.0,0.55,L2));',
    '  c=clamp(c,0.0,1.0);',
    '  float scan=sin(uv.y*uResolution.y*3.14159);c*=1.0-uScan*(0.5+0.5*scan)*0.55;',
    '  c+=(rand(uv*(uTime+1.0))-0.5)*uNoise;',
    '  c*=1.0-d*0.85;',
    '  if(uv.x<0.0||uv.x>1.0||uv.y<0.0||uv.y>1.0)c=vec3(0.0);',
    '  gl_FragColor=vec4(c,1.0);}'
  ].join('\n'),
  depthTest:false,depthWrite:false});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),postMat));
/* ---- 相机遮挡体 ----
   只用于镜头推近判断，不参与玩家碰撞（solids 归 solids）。
   雨棚、门卫亭、车身、厂房屋檐都注册成带高度的盒子，
   相机理想位置被挡住时按可见比例收短距离，就不会穿棚顶、穿墙、穿车。 */
var occl=[];
function occlBox(x,y0,z,hw,hd,h){occl.push({x:x,y0:y0,y1:y0+h,z:z,hw:hw,hd:hd});}
function camClearance(lx,ly,lz,tx,ty,tz){
  var steps=16,prev=1;
  for(var i=1;i<=steps;i++){
    var t=i/steps;
    var sx=lx+(tx-lx)*t,sy=ly+(ty-ly)*t,sz=lz+(tz-lz)*t;
    for(var j=0;j<occl.length;j++){
      var o=occl[j];
      if(sy>o.y0&&sy<o.y1&&Math.abs(sx-o.x)<o.hw+0.14&&Math.abs(sz-o.z)<o.hd+0.14)
        return prev===1?t*0.9:prev;
    }
    prev=t;
  }
  return 1;
}
function renderFrame(){
  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);
  postMat.uniforms.tDiffuse.value=rt.texture;
  postMat.uniforms.uTime.value=tAll;
  renderer.setRenderTarget(null);
  renderer.render(postScene,postCam);
}

scene.add(new THREE.AmbientLight(0x1a2630,0.17));
scene.add(new THREE.HemisphereLight(0x263747,0x0d0e08,0.24));
var moon=new THREE.DirectionalLight(0x7589a7,0.18);moon.position.set(-9,15,7);
moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-30;moon.shadow.camera.right=30;
moon.shadow.camera.top=30;moon.shadow.camera.bottom=-30;
moon.shadow.camera.near=1;moon.shadow.camera.far=70;
moon.shadow.bias=-0.0008;
scene.add(moon);

/* ============ 程序化贴图 ============ */
function mkTex(w,h,draw){
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');draw(x,w,h);
  var t=new THREE.CanvasTexture(c);t.anisotropy=1;
  /* 点过滤：近处像素硬边，PSX 观感；POT 尺寸保留 mip 防远处闪烁 */
  t.magFilter=THREE.NearestFilter;t.minFilter=THREE.LinearMipmapLinearFilter;
  return t;
}
/* 水泥地：水渍、裂缝、轮胎印、旧漆线 */
var concreteTex=mkTex(256,256,function(x,w,h){
  x.fillStyle='#2b2d31';x.fillRect(0,0,w,h);
  for(var i=0;i<9000;i++){
    var g=(30+Math.random()*22)|0;
    x.fillStyle='rgba('+g+','+(g+1)+','+(g+3)+',0.55)';
    x.fillRect(Math.random()*w,Math.random()*h,2,2);
  }
  /* 大块水渍：比周围深、偏冷 */
  for(var k=0;k<26;k++){
    var cx=Math.random()*w,cy=Math.random()*h,r=8+Math.random()*26;
    var gd=x.createRadialGradient(cx,cy,0,cx,cy,r);
    gd.addColorStop(0,'rgba(16,20,26,0.55)');
    gd.addColorStop(0.7,'rgba(20,24,30,0.22)');
    gd.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gd;x.beginPath();x.arc(cx,cy,r,0,6.284);x.fill();
  }
  /* 裂缝 */
  for(var c2=0;c2<6;c2++){
    x.strokeStyle='rgba(16,18,22,0.45)';x.lineWidth=1;
    var px=Math.random()*w,py=Math.random()*h;x.beginPath();x.moveTo(px,py);
    for(var s=0;s<7;s++){px+=(Math.random()-0.5)*26;py+=(Math.random()-0.5)*26;x.lineTo(px,py);}
    x.stroke();
  }
  /* 奶渍：排水口附近垂流的奶白痕，夜里发一点病态的亮 */
  for(var m=0;m<7;m++){
    var mx2=Math.random()*w,my=Math.random()*h*0.5;
    x.strokeStyle='rgba(214,220,208,'+(0.06+Math.random()*0.08).toFixed(2)+')';
    x.lineWidth=2+Math.random()*3;
    x.beginPath();x.moveTo(mx2,my);
    x.lineTo(mx2+(Math.random()-0.5)*6,my+30+Math.random()*50);x.stroke();
  }
  /* 旧漆线：褪成灰黄 */
  x.strokeStyle='rgba(150,146,118,0.20)';x.lineWidth=6;
  x.beginPath();x.moveTo(0,196);x.lineTo(w,190);x.stroke();
});
concreteTex.wrapS=concreteTex.wrapT=THREE.RepeatWrapping;
concreteTex.repeat.set(14,14);

/* 压型钢板：竖向棱 + 锈迹 */
var sidingTex=mkTex(128,128,function(x,w,h){
  x.fillStyle='#2e3135';x.fillRect(0,0,w,h);
  for(var i=0;i<w;i+=8){
    x.fillStyle='rgba(255,255,255,0.045)';x.fillRect(i,0,2,h);
    x.fillStyle='rgba(0,0,0,0.20)';x.fillRect(i+4,0,2,h);
  }
  for(var r=0;r<10;r++){
    var rx=Math.random()*w,ry=Math.random()*h*0.6;
    var gd=x.createLinearGradient(rx,ry,rx,ry+30+Math.random()*40);
    gd.addColorStop(0,'rgba(112,66,32,0.28)');
    gd.addColorStop(1,'rgba(112,66,32,0)');
    x.fillStyle=gd;x.fillRect(rx,ry,2+Math.random()*3,30+Math.random()*40);
  }
  x.fillStyle='rgba(0,0,0,0.22)';x.fillRect(0,h-16,w,16);
});
sidingTex.wrapS=sidingTex.wrapT=THREE.RepeatWrapping;
sidingTex.repeat.set(6,1.6);

/* 铁丝网：透明底 + 菱形网格 */
var chainTex=mkTex(64,64,function(x,w,h){
  x.clearRect(0,0,w,h);
  x.strokeStyle='rgba(150,160,168,0.62)';x.lineWidth=2;
  for(var i=-w;i<w*2;i+=16){
    x.beginPath();x.moveTo(i,0);x.lineTo(i+h,h);x.stroke();
    x.beginPath();x.moveTo(i,h);x.lineTo(i+h,0);x.stroke();
  }
});
chainTex.wrapS=chainTex.wrapT=THREE.RepeatWrapping;
chainTex.repeat.set(48,2);

/* 径向光晕 */
var glowTex=mkTex(64,64,function(x,w,h){
  var g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  g.addColorStop(0,'rgba(255,246,224,1)');
  g.addColorStop(0.28,'rgba(255,222,168,0.55)');
  g.addColorStop(1,'rgba(255,196,132,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
function glow(color,size,op,x,y,z,parent){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,
    transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
  s.scale.set(size,size,1);s.position.set(x,y,z);(parent||scene).add(s);return s;
}

/* 水花涟漪 */
var ringTex=mkTex(48,48,function(x,w,h){
  x.clearRect(0,0,w,h);
  x.strokeStyle='rgba(198,216,232,0.85)';x.lineWidth=3;
  x.beginPath();x.arc(w/2,h/2,w/2-4,0,6.284);x.stroke();
});

/* 门牌 / 厂牌 */
function textTex(txt,sub,w,h,fg,bg,fs){
  return mkTex(w,h,function(x){
    x.fillStyle=bg;x.fillRect(0,0,w,h);
    x.strokeStyle='rgba(230,226,207,0.5)';x.lineWidth=3;x.strokeRect(4,4,w-8,h-8);
    x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';
    x.font='700 '+fs+'px "Microsoft YaHei",sans-serif';
    x.fillText(txt,w/2,sub?h*0.42:h/2);
    if(sub){x.font='700 '+(fs*0.5|0)+'px "Microsoft YaHei",sans-serif';
      x.fillStyle='rgba(220,214,190,0.72)';x.fillText(sub,w/2,h*0.76);}
  });
}
var signTex=textTex('三号车间','重地  闲人免进',256,112,'#efe9d6','#2b3641',44);
var gateSignTex=textTex('奶 厂','NO.3  DAIRY',224,88,'#f2edda','#26313b',40);
/* 安全生产标语 */
var bannerTex=mkTex(384,48,function(x,w,h){
  x.fillStyle='#8e2420';x.fillRect(0,0,w,h);
  x.fillStyle='rgba(0,0,0,0.18)';x.fillRect(0,0,w,4);x.fillRect(0,h-4,w,4);
  x.fillStyle='#f0ece0';x.textAlign='center';x.textBaseline='middle';
  x.font='700 30px "Microsoft YaHei",sans-serif';
  x.fillText('安 全 生 产 · 人 人 有 责',w/2,h/2+1);
});

/* ============ 通用 ============ */
function mat(color,extra){
  var o={color:color};if(extra)for(var k in extra)o[k]=extra[k];
  return new THREE.MeshLambertMaterial(o);
}
function box(w,h,d,m,x,y,z,parent){
  var mm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    (typeof m==='number')?mat(m):m);
  mm.position.set(x,y,z);(parent||scene).add(mm);return mm;
}
function plane(w,h,m,x,y,z,rx,parent){
  var mm=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    (typeof m==='number')?mat(m):m);
  mm.position.set(x,y,z);if(rx)mm.rotation.x=rx;(parent||scene).add(mm);return mm;
}

/* ============ 地面 ============ */
/* 湿地面：PBR 低粗糙度 + 一点金属度，路灯和门光在地面拉出真实高光倒影 */
var groundMat=new THREE.MeshStandardMaterial({map:concreteTex,color:0x30383d,
  roughness:0.42,metalness:0.16});
var ground=plane(120,120,groundMat,0,-0.02,0,-Math.PI/2);
ground.receiveShadow=true;
/* 门口被灯照亮的一块：加色软斑，制造"暖光洒出来" */
var doorPool=plane(9,7,new THREE.MeshBasicMaterial({map:glowTex,color:0xffbe7a,
  transparent:true,opacity:0.15,blending:THREE.AdditiveBlending,depthWrite:false}),
  0,-0.008,12.6,-Math.PI/2);
/* 水洼：几块拉长的加色亮带，模拟积水映灯光 */
var puddleMat=new THREE.MeshBasicMaterial({map:glowTex,color:0x9fc0e0,
  transparent:true,opacity:0.14,blending:THREE.AdditiveBlending,depthWrite:false});
[[-2.6,4.2,4.2,2.2],[3.6,-3.4,3.4,1.8],[-6.4,-6.8,5,2.4],[7.4,5.6,3.2,1.6]].forEach(function(p){
  plane(p[2],p[3],puddleMat,p[0],0.004,p[1],-Math.PI/2);
});

/* ============ 厂房 ============ */
var sidingMat=new THREE.MeshLambertMaterial({map:sidingTex,color:0x70777a});
var wallMat=mat(0x2b3034);
var bodyMat=new THREE.MeshLambertMaterial({map:sidingTex,color:0x747b7d});
/* 前墙（z=17）：中间留 3.6 m 门洞，洞高 3.4 */
box(22,9.5,0.9,bodyMat,-12.8,4.75,17).castShadow=true;
box(22,9.5,0.9,bodyMat,12.8,4.75,17).castShadow=true;
box(3.6,6.1,0.9,bodyMat,0,6.45,17).castShadow=true;
/* 屋顶压顶 + 檐口暗线 */
box(48,0.5,9.2,mat(0x22262b),0,9.7,13.0);
box(48,0.26,9.6,mat(0x191d22),0,9.44,13.0);
/* 门洞内壁 + 内部暖光 */
var innerMat=mat(0x241f18);
box(3.6,0.2,2.2,innerMat,0,0.1,18.1);
box(0.2,3.4,2.2,innerMat,-1.7,1.7,18.1);
box(0.2,3.4,2.2,innerMat,1.7,1.7,18.1);
box(3.6,3.4,0.2,mat(0x2a241c),0,1.7,19.1);
/* 门里的暖光面（看得见的一团黄） */
plane(3.2,3.0,new THREE.MeshBasicMaterial({map:glowTex,color:0xffc277,
  transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}),
  0,1.7,18.9,-0,scene).rotation.y=Math.PI;
var doorLight=new THREE.PointLight(0xffa85c,2.8,19,2);doorLight.position.set(0,2.0,17.9);scene.add(doorLight);
/* 卷帘门卷筒（半开）+ 门框 */
box(3.8,0.7,0.5,mat(0x4a4f55),0,3.5,16.6);
var doorFrame=box(4.2,0.22,0.34,mat(0x5a6066),0,3.86,16.55);
doorFrame.material.emissive=new THREE.Color(0x161310);
/* 门口雨棚 + 檐下灯 */
box(5.4,0.16,1.9,mat(0x3d4249),0,4.2,16.1);
box(0.14,0.9,0.14,mat(0x3d4249),-2.4,4.7,15.4);
box(0.14,0.9,0.14,mat(0x3d4249),2.4,4.7,15.4);
var lampHead=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.16,0.3),

/* ============ 与公路同款救护车 ============
   前方一旦进入 outdoor，玩家看到的就是 Buhanka 救护车；停车场若仍停
   程序化小轿车，上车瞬间必然换皮。这里直接解析同一份 OBJ 和 128px
   贴图，程序化车身只作加载失败兜底。 */
var proceduralCarParts=carG.children.slice();
var yardCarModel=new THREE.Group();yardCarModel.visible=false;carG.add(yardCarModel);
var yardCarLoaded=false;
var yardStrobes=[];
function yardMountCar(root){
  var bb=new THREE.Box3().setFromObject(root),sz=new THREE.Vector3(),ctr=new THREE.Vector3();
  bb.getSize(sz);bb.getCenter(ctr);
  if(!(sz.x>0&&sz.y>0&&sz.z>0))throw new Error('car box invalid');
  var s=1.94/sz.x;
  var inner=new THREE.Group();
  inner.scale.setScalar(s);
  inner.position.set(-ctr.x*s,-bb.min.y*s,-ctr.z*s);
  root.children.slice().forEach(function(c){inner.add(c);});
  yardCarModel.add(inner);
  /* OBJ 车头朝 +Z，场景车头朝 -Z。 */
  yardCarModel.rotation.y=Math.PI;
  yardCarModel.visible=true;
  yardCarLoaded=true;
  proceduralCarParts.forEach(function(o){o.visible=false;});
  /* 救护车顶灯：一蓝一红，和 outdoor 的灯色一致 */
  [[-0.56,0x63bdff],[0.56,0xff5e54]].forEach(function(v){
    var sp=glow(v[1],.66,.32,v[0],2.13,-.05,yardCarModel);
    sp.userData.baseOp=.32;yardStrobes.push(sp);
  });
  console.info('[yardCar] Buhanka 已接入 | 宽 '+(sz.x*s).toFixed(2)+
    ' 高 '+(sz.y*s).toFixed(2)+' 长 '+(sz.z*s).toFixed(2)+' m');
}
function yardLoadCar(){
  fetch('assets/vehicle/buhanka_ambulance.obj').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    var vs=[],vts=[],vns=[],pos=[],uvs=[],norms=[];
    var idx=function(raw,len){return raw<0?len+raw:raw-1;};
    txt.split(/\r?\n/).forEach(function(raw){
      var line=raw.trim();
      if(!line||line.charAt(0)==='#')return;
      var p=line.split(/\s+/);
      if(p[0]==='v')vs.push(+p[1],+p[2],+p[3]);
      else if(p[0]==='vt')vts.push(+p[1],+(p[2]||0));
      else if(p[0]==='vn')vns.push(+p[1],+p[2],+p[3]);
      else if(p[0]==='f'&&p.length>=4){
        var f=p.slice(1).map(function(ss){
          var q=ss.split('/');
          return {v:idx(+q[0],vs.length/3),
            t:q[1]?idx(+q[1],vts.length/2):-1,
            n:q[2]?idx(+q[2],vns.length/3):-1};
        });
        for(var j=1;j<f.length-1;j++){
          [f[0],f[j],f[j+1]].forEach(function(q){
            pos.push(vs[q.v*3],vs[q.v*3+1],vs[q.v*3+2]);
            if(q.t>=0)uvs.push(vts[q.t*2],vts[q.t*2+1]);
            if(q.n>=0)norms.push(vns[q.n*3],vns[q.n*3+1],vns[q.n*3+2]);
          });
        }
      }
    });
    if(!pos.length)throw new Error('OBJ 没有有效面');
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    if(uvs.length===pos.length/3*2)geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
    if(norms.length===pos.length)geo.setAttribute('normal',new THREE.Float32BufferAttribute(norms,3));
    else geo.computeVertexNormals();
    new THREE.TextureLoader().load('assets/vehicle/buhanka_skoraya_albedo.png',function(tex){
      tex.magFilter=THREE.NearestFilter;tex.minFilter=THREE.LinearFilter;
      tex.generateMipmaps=false;
      if('colorSpace'in tex&&THREE.SRGBColorSpace!==undefined)tex.colorSpace=THREE.SRGBColorSpace;
      var carMatY=new THREE.MeshLambertMaterial({
        map:tex,emissiveMap:tex,color:0xffffff,emissive:0x181914,
        side:THREE.DoubleSide,flatShading:true
      });
      var root=new THREE.Group();
      root.add(new THREE.Mesh(geo,carMatY));
      yardMountCar(root);
    },undefined,function(e){console.warn('[yardCar] 贴图失败：',e);});
  }).catch(function(e){console.warn('[yardCar] OBJ 失败，保留程序化车身：',e);});
}

/* ============ 角色模型接入 ============
   yard 与工厂共用 assets/nailong_data.js 里的同一个 GLB；只做一次
   归一化、贴地，不再重画一套几何角色。材质降到 Lambert + 点过滤，
   与工厂、室外低色阶保持一致。 */
(function loadYardHero(){
  if(!window.GLTFLoader||!window.NAILONG_GLB_B64)return;
  try{
    var bin=atob(window.NAILONG_GLB_B64),arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    new window.GLTFLoader().parse(arr.buffer,'',function(gltf){
      var root=gltf.scene;
      var colors={'yellow':0x9a916d,'材质':0x55753f,'材质.001':0x11140f,'材质.002':0x201f18};
      root.traverse(function(o){
        if(!o.isMesh)return;
        var old=Array.isArray(o.material)?o.material[0]:o.material;
        var c=old&&colors[old.name]!==undefined?colors[old.name]:0x8c8768;
        var nn=new THREE.MeshLambertMaterial({
          color:c,emissive:0x070905,flatShading:true
        });
        if(old&&old.map){
          nn.map=old.map;nn.map.magFilter=THREE.NearestFilter;
          nn.map.minFilter=THREE.LinearFilter;nn.map.needsUpdate=true;
        }
        o.material=nn;
      });
      var bb=new THREE.Box3().setFromObject(root),sz=new THREE.Vector3();
      bb.getSize(sz);
      var sc=1.52/(sz.y||1);
      root.scale.setScalar(sc);
      var bb2=new THREE.Box3().setFromObject(root);
      root.position.y=-bb2.min.y;
      /* 模型正面与工厂角色一致，确定面向 -z */
      modelHero=root;
      hero.add(root);
      fallbackHero.visible=false;
      console.info('[yardHero] GLB 已接入，高度 1.52 m');
    },undefined,function(e){console.warn('[yardHero] GLB 加载失败，保留占位：',e);});
  }catch(e){console.warn('[yardHero] GLB 解析失败，保留占位：',e);}

var actx=null,rainGain=null;

    var lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4200;

/* ============ 碰撞：停车场里的硬东西 ============
   之前只有车身一个圆形排斥，柱子、叉车、油桶、门卫室全都能直接穿过去。
   现在按"圆 + 轴对齐矩形"建一批简单碰撞体：玩家半径 0.42，
   解算时沿最小穿透轴推出去（不是直接归零），所以贴着柱角走会自然滑动，
   不会被硬卡死在障碍边上。不需要物理引擎，一帧最多三次迭代。 */
var PR=0.42;
var solids=[];
function blockRect(x,z,hw,hd){solids.push({x:x,z:z,hw:hw,hd:hd});}
function blockCircle(x,z,r){solids.push({x:x,z:z,r:r});}
function collide(px,pz){
  for(var it=0;it<3;it++){
    var hit=false;
    for(var i=0;i<solids.length;i++){
      var s=solids[i];
      if(s.r){
        var dx=px-s.x,dz=pz-s.z,d=Math.hypot(dx,dz),m=s.r+PR;
        if(d<m&&d>1e-4){px=s.x+dx/d*m;pz=s.z+dz/d*m;hit=true;}
      }else{
        var ax=px-s.x,az=pz-s.z;
        var ox=s.hw+PR-Math.abs(ax),oz=s.hd+PR-Math.abs(az);
        if(ox>0&&oz>0){
          /* 谁浅推谁：从短边出去，长边方向保留位移＝沿墙滑动 */
          if(ox<oz)px=s.x+(ax>=0?1:-1)*(s.hw+PR);
          else pz=s.z+(az>=0?1:-1)*(s.hd+PR);
          hit=true;
        }
      }
    }
    if(!hit)break;
  }
  return [px,pz];
}

  blockCircle(-7.2,12.2,0.28);
  /* 奶箱堆：右带尾 / 左带口 / 通道边 */
  blockCircle(14.6,1.2,0.5);blockCircle(-15.9,-10.6,0.5);blockCircle(1.9,14.2,0.4);
  [[-6.4,4.6],[4.2,6.4],[-11.4,-3.2],[9.8,-10.2],[14.4,-9.4]]
    .forEach(function(p){blockCircle(p[0],p[1],0.24);});
  blockCircle(-18.4,-2.2,0.2);blockCircle(-18.4,7.4,0.2);
  /* 自己那辆车：矩形比圆准，走到车门旁就停住，不会陷进车身 */
  blockRect(carG.position.x,carG.position.z,0.96,2.18);
})();

/* ---- 相机遮挡体注册（只影响镜头推近，不影响玩家碰撞） ---- */
(function(){
  /* 右带各跨顶板（缺失跨 8.1~11.2 不登记，镜头能从缺口看到人） */
  [[0.9,4.9,2.98],[4.9,8.1,2.90],[11.2,13.6,3.02],[13.6,15.0,2.96]]
    .forEach(function(b){occlBox((b[0]+b[1])/2,b[2]-0.3,-2.4,(b[1]-b[0])/2,4.8,0.55);});
  /* 左带低棚三段 + 门口通道顶 + 门卫室 + 装卸平台 */
  [[-10.4,-6.6,2.55],[-6.6,-2.6,2.62],[-2.6,1.4,2.50]]
    .forEach(function(s){occlBox(-16.1,s[2]-0.3,(s[0]+s[1])/2,3.3,(s[1]-s[0])/2,0.5);});
  occlBox(0,3.3,13.0,2.7,4.0,0.45);
  occlBox(-16.6,0,-9.2,1.95,1.75,2.8);
  occlBox(-13,0,13.6,3.6,2.4,1.0);
  /* 厂房前墙（含门洞上方的门楣）与本体 */
  occlBox(-12.8,0,17,11,0.55,9.5);occlBox(12.8,0,17,11,0.55,9.5);
  occlBox(0,3.4,17,1.9,0.55,6.1);
  /* 主角车 + 四台停死车：镜头绕到车背时贴上去，不穿模 */
  occlBox(6.5,0,-1.6,1.05,2.3,2.15);
  occlBox(2.9,0,-1.9,1.0,2.25,1.6);
  occlBox(12.4,0,-2.3,1.05,2.4,1.9);
  occlBox(-16.2,0,-8.4,2.35,1.05,1.9);
  occlBox(-16.3,0,0.5,2.2,1.0,1.55);
})();

/* ============ 控制 ============ */
var keys={},dragging=false,lastX=0,lastY=0,started=false,leaving=false;
window.addEventListener('keydown',function(e){
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='e')tryBoard();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
canvas.addEventListener('mousedown',function(e){dragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mouseup',function(){dragging=false;});
window.addEventListener('mousemove',function(e){
  if(!dragging)return;
  /* 第三人称轨道镜头：往右拖＝镜头绕到角色右侧往右看，
     只改目标角，主循环里弹簧跟随，不瞬移。 */
  yawTarget-=(e.clientX-lastX)*0.0022;
  pitchTarget-=(e.clientY-lastY)*0.0013;
  pitchTarget=Math.max(-0.18,Math.min(0.55,pitchTarget));
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener('touchstart',function(e){
  if(!e.touches.length)return;
  dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
},{passive:true});
window.addEventListener('touchend',function(){dragging=false;});
window.addEventListener('touchmove',function(e){
  if(!dragging||!e.touches.length)return;
  var dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
  yawTarget-=dx*0.0022;pitchTarget-=dy*0.0013;
  pitchTarget=Math.max(-0.18,Math.min(0.55,pitchTarget));
  lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
},{passive:true});

var hintEl=document.getElementById('hint');
function tryBoard(){
  if(leaving||!started)return;
  var d=Math.hypot(player.x-carG.position.x,player.z-carG.position.z);
  if(d>4.4)return;
  leaving=true;
  document.getElementById('fade').style.opacity='1';
  if(rainGain&&actx)rainGain.gain.linearRampToValueAtTime(0,actx.currentTime+0.9);
  setTimeout(function(){document.getElementById('cap').classList.add('on');},450);
  setTimeout(function(){location.href='outdoor.html?from=factory&act=3';},2100);
}

/* 验收用：读/摆玩家位置，不参与游戏逻辑 */
window.__yard={
  p:function(){return {x:+player.x.toFixed(2),z:+player.z.toFixed(2)};},
  set:function(x,z){player.x=x;player.z=z;},
  solids:function(){return solids.length;},
  assets:function(){return {hero:!!modelHero,car:yardCarLoaded};},
  bench:function(n){
    n=n||12;var t0=performance.now();
    for(var i=0;i<n;i++)renderFrame();
    renderer.getContext().finish();
    return +((performance.now()-t0)/n).toFixed(2);
  }
};

/* ============ 主循环 ============ */
/* r149 _legacy 衰减下 PointLight 光斑比物理衰减肥得多，十几盏叠在一起会把
   停车场照成白天；统一收 0.4 倍，只留光池和湿反光，夜才压得住。 */
scene.traverse(function(o){if(o.isPointLight)o.intensity*=0.4;});
var clock=new THREE.Clock();
var tAll=0;
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,clock.getDelta());
  tAll+=dt;
  /* 老化灯管频闪：棚里/通道里所有 flicker 态灯管同一套节奏，相位错开 */
  for(var cti=0;cti<canopyTubes.length;cti++){
    var ct=canopyTubes[cti];
    if(!ct||ct.st!=='flicker'||!ct.l)continue;
    var cf=(Math.sin(tAll*7.3+cti*1.7)+Math.sin(tAll*19.7+cti*1.3))>1.35?0.12:1;
    ct.h.material.color.setRGB(0.71*cf,0.54*cf,0.31*cf);
    ct.l.intensity=0.44*cf;
  }
  /* 角度缓动：鼠标只给目标角，慢慢跟过去 */
  var es=Math.min(1,dt*6.5);
  yaw+=(yawTarget-yaw)*es;
  pitch+=(pitchTarget-pitch)*es;

  var walking=false;
  if(started&&!leaving){
    var sp=3.0*dt;
    /* 移动方向跟着镜头朝向：W 永远是"往画面里走" */
    var fx=-Math.sin(yaw),fz=-Math.cos(yaw);
    var mx=0,mz=0;
    if(keys['w']||keys['arrowup']){mx+=fx;mz+=fz;}
    if(keys['s']||keys['arrowdown']){mx-=fx;mz-=fz;}
    if(keys['a']||keys['arrowleft']){mx+=fz;mz-=fx;}
    if(keys['d']||keys['arrowright']){mx-=fz;mz+=fx;}
    var len=Math.hypot(mx,mz);
    if(len>0){
      mx/=len;mz/=len;walking=true;
      var nx=Math.max(-19,Math.min(19,player.x+mx*sp));
      var nz=Math.max(-12.6,Math.min(18.2,player.z+mz*sp));
      /* 先走过去，再沿最小穿透轴推出来：贴着柱子/车/围栏走会滑动，不会卡死 */
      var rp=collide(nx,nz);
      player.x=Math.max(-19,Math.min(19,rp[0]));
      player.z=Math.max(-12.6,Math.min(18.2,rp[1]));
      /* 角色朝移动方向转身（平滑），不是瞬移。
         模型脸朝 -z：rotation.y=θ 时朝向 (-sinθ,-cosθ)，
         所以要朝 (mx,mz) 走，θ=atan2(-mx,-mz)。之前写成 atan2(mx,-mz)，
         横移时角色正好背对前进方向倒着走，看着就"全反了"、非常晕。 */
      var want=Math.atan2(-mx,-mz);
      var df=want-player.face;
      while(df>Math.PI)df-=Math.PI*2;
      while(df<-Math.PI)df+=Math.PI*2;
      player.face+=df*Math.min(1,dt*9);
    }
    var dd=Math.hypot(player.x-carG.position.x,player.z-carG.position.z);
    hintEl.className=(dd<4.4?'on':'');
    hintEl.textContent='按 E 上车';
  }

  /* 角色：站到玩家位置，走路摆腿。晃动只作用在角色身上，绝对不传给相机 */
  hero.position.set(player.x,0,player.z);
  hero.rotation.y=player.face;
  heroFill.position.set(player.x+.25,1.7,player.z+.25);
  var sw=walking?Math.sin(tAll*9)*0.5:0;
  legL.rotation.x+=(sw-legL.rotation.x)*Math.min(1,dt*12);
  legR.rotation.x+=(-sw-legR.rotation.x)*Math.min(1,dt*12);
  hero.position.y=walking?Math.abs(Math.sin(tAll*9))*0.035:0;

  /* ---- 第三人称弹簧相机 ----
     目标点：角色正后方 CAM_DIST 米、高 CAM_H，pitch 决定俯视角度。
     用与帧率无关的指数平滑跟过去：角色动，相机慢半拍，光流平缓不晕。
     遮挡时按可见比例把目标距离收短（推近也是弹簧跟，不瞬移）。 */
  var back=CAM_DIST*Math.cos(pitch);
  var tgtX=player.x+Math.sin(yaw)*back;
  var tgtZ=player.z+Math.cos(yaw)*back;
  var tgtY=CAM_H+CAM_DIST*Math.sin(pitch);
  var vis=camClearance(player.x,1.35,player.z,tgtX,tgtY,tgtZ);
  var visK=Math.max(0.22,vis);
  tgtX=player.x+(tgtX-player.x)*visK;
  tgtZ=player.z+(tgtZ-player.z)*visK;
  tgtY=1.35+(tgtY-1.35)*visK;
  if(tgtY<0.42)tgtY=0.42;
  var k=1-Math.exp(-dt*5.0);
  camPos.x+=(tgtX-camPos.x)*k;
  camPos.y+=(tgtY-camPos.y)*k;
  camPos.z+=(tgtZ-camPos.z)*k;
  camera.position.copy(camPos);
  /* 看向角色胸口稍上方，注视点也平滑，画面不会跟着脚步跳 */
  var lk=1-Math.exp(-dt*7.0);
  camLook.x+=(player.x-camLook.x)*lk;
  camLook.y+=(1.1-camLook.y)*lk;
  camLook.z+=(player.z-camLook.z)*lk;
  camera.lookAt(camLook);
  /* 雨 */
  var pa=rg.attributes.position.array;
  for(var i=0;i<RN;i++){
    var dy=rv[i]*dt;
    pa[i*6+1]-=dy;pa[i*6+4]-=dy;
    if(pa[i*6+4]<0){
      var nx=(Math.random()-0.5)*50,nz=(Math.random()-0.5)*46+2;
      pa[i*6]=nx;pa[i*6+1]+=16;pa[i*6+2]=nz;
      pa[i*6+3]=nx+0.16;pa[i*6+4]+=16;pa[i*6+5]=nz+0.06;
    }
  }
  rg.attributes.position.needsUpdate=true;
  /* 水花 */
  for(var k=0;k<ripples.length;k++){
    var r=ripples[k];r.t+=dt;
    if(r.t>r.dur){resetRipple(r);continue;}
    var kk=r.t/r.dur;
    r.m.material.opacity=0.24*(1-kk);
    var s=0.3+kk*1.5;r.m.scale.set(s,s,1);
  }
  /* 烟囱顶的红灯一明一暗 */
  stackLight.material.opacity=0.28+0.3*(0.5+0.5*Math.sin(tAll*1.5));
  for(var si=0;si<yardStrobes.length;si++){
    var ss=yardStrobes[si],phase=si?Math.PI:0;
    ss.material.opacity=(Math.sin(tAll*9+phase)>0.25?.52:.10);
  }
  renderFrame();
}
/* 调试机位：?cam=x,y,z（第三人称下 x,z 是角色位置）&look=yaw,pitch */
(function(){
  var q=new URLSearchParams(location.search);
  if(q.has('cam')){
    var c=q.get('cam').split(',').map(Number);
    player.x=c[0];player.z=c[2];
    var back=CAM_DIST*Math.cos(pitch);
    camPos.set(player.x+Math.sin(yaw)*back,CAM_H+CAM_DIST*Math.sin(pitch),
      player.z+Math.cos(yaw)*back);
    camLook.set(player.x,1.1,player.z);
    camera.position.copy(camPos);camera.lookAt(camLook);
    hero.position.set(player.x,0,player.z);
    if(q.has('look')){var l=q.get('look').split(',').map(Number);
      yaw=yawTarget=l[0];pitch=pitchTarget=l[1]||0.16;}
  }
  if(q.has('start')||q.get('from')==='factory'){
    document.getElementById('start').style.display='none';started=true;
  }
  if(q.get('from')==='factory'){
    var fadeEl=document.getElementById('fade');
    fadeEl.style.opacity='1';
    setTimeout(function(){fadeEl.style.opacity='0';},120);
    /* 自动开始时没有点击手势，AudioContext 起不来：挂一次性监听，
       第一次按键/点击/触屏就补上雨声，不刷警告。 */
    var kick=function(){
      try{startAudio();if(actx&&actx.state==='suspended')actx.resume();}catch(e){}
      window.removeEventListener('keydown',kick);
      window.removeEventListener('mousedown',kick);
      window.removeEventListener('touchstart',kick);
    };
    window.addEventListener('keydown',kick);
    window.addEventListener('mousedown',kick);
    window.addEventListener('touchstart',kick,{passive:true});
  }
})();
loop();

document.getElementById('btnGo').onclick=function(){
  document.getElementById('start').style.display='none';
  started=true;
  startAudio();
};
</script>
